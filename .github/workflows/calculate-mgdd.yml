name: Daily MGDD Weather Sync 

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Runs your completely clean, fixed JavaScript data loop
      - name: Run Weather Data Collection Script
        run: node nn/scripts/weather-sync.js

      # Saves the generated data file right back to your repository
      - name: Commit and Push Updated Weather Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          git add nn/data/weather-cache.json
          git diff-index --quiet HEAD || git commit -m "Automated night-sync: Updated local MGDD values"
          git push


