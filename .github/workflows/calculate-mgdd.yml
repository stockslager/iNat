name: Daily MGDD Weather Sync

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches: [ master ]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-sync:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # This runs your exact JavaScript file securely
      - name: Run Weather Data Collection Script
        run: node nn/scripts/weather-sync.js

      # Setup and package your website files for deployment
      - name: Setup GitHub Pages Site Assets
        uses: actions/configure-pages@v4

      - name: Upload Static Website Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # Packs your whole project directory for deployment

      # Deploys your live website using official, authenticated channels
      - name: Deploy to GitHub Pages Production
        id: deployment
        uses: actions/deploy-pages@v4

