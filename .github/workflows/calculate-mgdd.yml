name: Daily MGDD Weather Sync

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches: [ master, gh-pages ]

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # THIS STEP WILL FORCE THE RUNNER TO SHOW THE EXACT ERROR TEXT 
      # INSTEAD OF JUST SILENTLY DYING AFTER 10 SECONDS
      - name: Run Weather Data Collection Script
        run: |
          node nn/scripts/weather-sync.js 2>&1 || (echo "=== SCRIPT FATAL ERROR REASON ===" && node nn/scripts/weather-sync.js && exit 1)

      # Only attempts to push if the step above didn't crash
      - name: Commit and Push Updated Weather Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          git add nn/data/weather-cache.json
          git diff-index --quiet HEAD || git commit -m "Automated night-sync: Updated local MGDD values"
          git push origin HEAD:${{ github.ref_name }}
