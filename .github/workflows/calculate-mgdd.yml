name: Daily MGDD Weather Sync

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # NEW STEP: Downloads your project data to a file without using any JS scripts
      - name: Download Raw iNaturalist Observations
        run: |
          mkdir -p nn/data
          curl -s "https://inaturalist.org" -o nn/data/raw-obs.json

      - name: Run Weather Data Collection Script
        run: node nn/scripts/weather-sync.js

      - name: Commit and Push Updated Weather Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          git add nn/data/weather-cache.json
          git diff-index --quiet HEAD || git commit -m "Automated night-sync: Updated local MGDD values"
          git push
