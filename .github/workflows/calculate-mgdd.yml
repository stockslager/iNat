name: Daily MGDD Weather Sync

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches: [ master, gh-pages ]
    paths:
      - 'nn/scripts/weather-sync.js'

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name || github.event.repository.default_branch }}

      # Explicit setup ensures execution stability across branches
      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Weather Data Collection Script
        run: |
          node nn/scripts/weather-sync.js 2>&1 || (echo "=== SCRIPT FATAL ERROR REASON ===" && node nn/scripts/weather-sync.js && exit 1)

      - name: Commit and Push Updated Weather Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          git add nn/data/weather-cache.json
          
          # FIX IS HERE: Adding [skip ci] explicitly tells GitHub Pages NOT to cancel deployments for this file update
          git diff-index --quiet HEAD || git commit -m "Automated night-sync: Updated local MGDD values [skip ci]"
          
          git push origin HEAD:${{ github.ref_name || github.event.repository.default_branch }}
