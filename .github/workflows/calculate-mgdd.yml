name: Daily MGDD Weather Sync

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Find the Real File Path
        run: |
          echo "=== ACTUAL REPOSITORY FOLDER MAP ==="
          find . -maxdepth 3 -not -path '*/.*'
          echo "====================================="
