<!DOCTYPE html>      
<html lang="en">     
 
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />  
<meta name="viewport" content="width=device-width, minimum-scale=1.0" />
<meta name="apple-mobile-web-app-title" content="Plant Detail" />
<meta name="description" content="Plant Detail" />
<link rel="apple-touch-icon" sizes="180x180" href="../core/assets/plant-icon-192.png" />
<link rel="icon"    type="image/png"         href="../core/assets/plant-icon-96.png" sizes="96x96" />
<link rel="icon"    type="image/svg+xml"     href="../core/assets/plant-icon-96.svg" />
<link rel="shortcut icon"                    href="../core/assets/plant-club.ico" />
<link rel="manifest"                         href="../core/assets/plant_club.webmanifest" />
<link rel="stylesheet" type="text/css"       href="../core/css/core.css" />
<title>Plant Detail</title>
</head>
  
<style>
  /* 1. THE GUTTER FRAME */
  html {
      background-color: #0f172a;
      box-sizing: border-box;
      min-height: 100vh;
      padding: 10px 300px 24px 300px; /* Top, Right, Bottom, Left */
  }

  /* hide gutters on small screens */
  @media (max-width: 768px) {
    html {
      /* Keeps top/bottom spacing, but sets left/right gutters to 0 */
      padding: 10px 0px 24px 0px; 
    }
  }
 
  body {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      background-color: transparent;
  }
 
  /* 2. THE ALIGNMENT */
  #main, .navbar, .top-bar, #divhead {
    width: 100%;
    max-width: 100%;
    margin-left: 0;
    margin-right: 0;
    box-sizing: border-box;
  }

  /* 3. THE TOP BAR */
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: stretch;
    gap: 10px;
    margin-bottom: 10px;
  }

  /* 4. THE BOXES: Fixed horizontal scroll and standard styling */
  #stats, #dltest {
    display: block;
    box-sizing: border-box;
    max-height: 64px;
    overflow-y: auto;
    overflow-x: hidden; 
    width: fit-content;
    white-space: nowrap;
    border: 2px solid var(--color-border);
    border-radius: 5px;
    padding: 3px 8px;
    background: var(--color-base);
    line-height: 1.2;
    color: var(--color-text);
    font: 14px Sans-Serif;
  }

  /* 5. THE SHIELD: Reset internal table tags and remove ALL default underlines */
  #stats table, #stats td, #stats tr,
  #dltest table, #dltest td, #dltest tr {
    border: none;
    background: transparent;
    padding: 0 12px 0 0; /* Extra 12px padding to the right for breathing room */
    box-shadow: none;
    color: inherit;
    font: inherit;
    text-decoration: none; /* KILLS ALL UNDERLINES IN ALL ROWS */
    margin: 0; 
    border-collapse: collapse;
  }

  /* KILL UNDERLINES FOR ALL LINKS IN THE BOXES */
  #stats a, #dltest a {
    color: var(--color-text-link);
    text-decoration: none; 
  }

  /* RE-ADD UNDERLINE: Only for the very first row of the right box (#dltest) */
  /* This ensures text-only headers are underlined, but URLs remain clean */
  #dltest tr:first-child td {
    text-decoration: underline;
  }

  /* 6. NAVBAR */
  .navbar {
    background-color: var(--color-brand);
    border-radius: 5px;
    font-family: Arial, Helvetica, sans-serif;
    display: flex;
    align-items: center;
    min-height: 40px;
    overflow: hidden;
  }

/**********/
  .inat-floating-nav {
    margin-left: -8px;
    position: -webkit-sticky; /* Safari */
    position: sticky;
    left: 0;
    bottom: 0;
    background: var(--color-base-translucent);
    width: 188px;
    height: 52px;
    border-radius: 14px;
    
    /* Alignment: Centers the outlined button neatly inside this container */
    display: flex;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
  }

  @media print { 
    .inat-floating-nav { display: none; } 
  }

  .button.inat-wide-button {
    /* Resets the narrow 32px bounds so the text fits */
    width: 168px; 
    height: 36px; 
    margin: 0;    
    
    /* Inherits native styles */
    background: var(--color-alt);
    border: 1px solid var(--color-border);
    color: var(--color-text-link);
    
    /* Custom Typography */
    font-size: 13px;
    line-height: 1.2;
    border-radius: 8px; 
    
    /* Displays and centers multi-line text blocks */
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    white-space: normal;
    text-decoration: none;
    box-sizing: border-box;
    
    /* Apply translucency */
    opacity: 0.7;
    transition: opacity 0.2s ease, background 0.2s ease;
  }

  .button.inat-wide-button:hover {
    opacity: 1.0;
    background: var(--color-hover);
  }

/********audio*********/
/* Container placement and sizing */
.custom-audio-player {
  /* FIX: Changed from fixed to absolute to lock onto the parent wrapper */
  position: absolute; 
  
  /* Positions the player in the bottom-right corner of the image */
  bottom: 10px;        
  right: 10px;         
  z-index: 10;         /* Ensures player sits on top of the image graphic */
  
  width: 150px;        /* Explicitly set custom width */
  height: 40px;        /* Explicitly set custom height */
  
  display: flex;
  align-items: center;
  justify-content: space-around;
  background-color: #333333;
  border-radius: 5px;
  padding: 5px 10px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.3);
}

/* Button sizing adjustments */
.player-btn {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  border: none;
  background-color: #ffffff;
  color: #333333;
  font-size: 14px;
  cursor: pointer;
}

#dynamic-time-display {
  color: #ffffff;
  font-family: sans-serif;
  font-size: 12px;
}

.image-audio-wrapper {
  position: relative;
  display: inline-block;
}
.image-audio-wrapper img {
  display: block;
  max-width: 100%;
  height: auto;
}

/***** end audio ******/          
  /* Original Helpers */
  #h2 { font-weight:bold; font-size:20px; }
  p { width:100%; }
  .npcicon { width:14px; height:14px; border: 1px solid cornflowerblue; padding: 5px; border-radius: 50px; }
  .user_head { align-items: center; justify-content: center; }
  .user { display: inline-flex; align-items: center; white-space: nowrap; gap: 8px; margin-left: 2px; } 

</style>

<body>
<script type="text/javascript"   src='../core/js/common_functions.js'> </script>
<script type="text/javascript"   src='../core/js/store.js'> </script>
<script>
let winurlstr         = window.location.href;
let winurlsearchstr   = window.location.search;
let winurlexsearchstr = winurlstr.replace(winurlsearchstr,'');
let winurlparams      = new URLSearchParams(winurlsearchstr.substring(1));
let p_mode         = winurlparams.get('mode') || '';

let image_audio_name = '';

appState       = buildStateFromParams(winurlparams);

// constants 
const CONST_WITHOUT_TAXON_PLANTAE = '47126';
 
// find the html name to pass to other pages for nav
let path      = window.location.pathname;
let html_name = path.substring(path.lastIndexOf('/') + 1);
 
function buildMenu( results, config ) {
 
    // Create the main navbar container
    let navbar = document.createElement('div');
    navbar.className = 'navbar v2-menu';

    let baseUrl = window.location.origin + window.location.pathname;

    let menu_name = config.getSubIconNameByTaxonId(config, getMenuId(appState)) || CONST_SHOW;

    buildNavDDFilteredShow( navbar, menu_name, results, config, baseUrl );

    // only show the additional filters if they haven't made a seleciton from the taxa menu.
    // otherwise there's too much risk of queries with no results.
    if( !getMenuId(appState) ) {
        buildNavActivityFiltersDD( navbar, 'Filters', config );
    }

    // Build the Home Link
    let homeState = clearForGardenListParams(appState);
    let homeUrl = './garden_list.html';
    if( p_mode === 'activity' || p_mode === 'all' || p_mode === 'beds' ) { homeUrl = '../beds/beds.html'; }  
    if( p_mode === 'flower' ) { 
        homeState = clearForDashParams(appState); 
        homeState = setParams(homeState, 'nnn');
        homeUrl = '../studies/navigational_map/map.html'; 
        buildNavHome( navbar, homeUrl, homeState, config );
    } else {
        buildNavHome( navbar, homeUrl, homeState, config );
    }
    
    // Append the DOM nodes to the body
    faddelem('p', document.body).appendChild(navbar);
}

function buildPage(xobj, config) {
   let results = xobj.results;
 
   if (results) {
      let total_results = xobj.total_results;
      let per_page = xobj.per_page;
      let page_curr = xobj.page;
      let page_max = Math.ceil(total_results/per_page);
      let page_prev = ((page_curr>1)?page_curr-1:null);
      let page_next = ((page_curr<page_max)?page_curr+1:null);
      let labels = [];

      buildMenu( results, config );

      let title_1 = '', title_2 = '', title_3 = '';

      let titleText = CONST_ON + capitalizeWords(getPlantName(appState));
      let urlState = appState; 
      if( getMenuId(appState) ) {
          urlState = setTaxonId(appState, getMenuId(appState));
      } 

      let titleUrl = '';
      if( config.showStudyGrid === 'widget' ) {
          titleUrl = '../admin/widget_grid.html' + buildParameterList(urlState) + '&fieldname=' + config.fieldName + '&fieldvalue=' + getPlantId(appState);
      } else {
          titleUrl = './garden_grid.html' + buildParameterList(urlState);
      }
      let title_3_element = faddelem('a', null, { href: titleUrl });

      // CSS needs text inside span
      faddelem('span', title_3_element, { textContent: titleText });

      let header = buildHeader( CONST_SPECIES, total_results, per_page, page_curr, page_max, '', '', title_3_element ); 
    
      faddelem('p', document.body).appendChild(header);


   // Look for your main structural container instead of the body root 
   const mainContainer = document.getElementById('main') || document.body; 
   const pic = faddelem('p', mainContainer); 

   // Clear layout overrides; let the element use your new CSS rules natively
   pic.removeAttribute('style'); 

   // Create the parent wrapper container 
   const wrapper = document.createElement('div');
   wrapper.className = 'image-audio-wrapper';

   // Create dynamic image element (keeping exact styling rules)
   const img = document.createElement('img');
   img.src = root_photos + '722533441/small.jpg'; 
   img.style.height = 'auto';
   img.style.borderRadius = '5px';  
   img.style.objectFit = 'contain'; 
   img.className = 'anchored-image';

   // Create custom audio player block using a template string
   const audioPlayerContainer = document.createElement('div');
   audioPlayerContainer.className = 'custom-audio-player';
   audioPlayerContainer.innerHTML = '<audio class="dynamic-audio-track" preload="auto"> ' + 
      '<source src="./artwork/' + image_audio_name + '.mp3" type="audio/mpeg">' + 
      '</audio> ' + 
      '<button class="dynamic-play-btn player-btn" type="button">▶</button> ' + 
      '<span class="dynamic-time-display">0:00</span>';   

   // Nest everything safely together
   wrapper.appendChild(img);
   wrapper.appendChild(audioPlayerContainer);

   pic.appendChild(wrapper);

   // Direct Event Wiring (No separate function needed!)
   const audioTrack = audioPlayerContainer.querySelector('.dynamic-audio-track');
   const playBtn = audioPlayerContainer.querySelector('.dynamic-play-btn');
   const timeDisplay = audioPlayerContainer.querySelector('.dynamic-time-display');

   // Force the audio engine to load the file properties instantly
   if (audioTrack) {
     audioTrack.load();
   }

   // Native event listener for the play button
   if (playBtn && audioTrack) { 
     playBtn.addEventListener('click', function(e) { 
       e.stopPropagation(); // Stops parent containers from stealing the click
       e.preventDefault(); 

       if (audioTrack.paused) { 
         audioTrack.play() 
           .then(() => { playBtn.textContent = '⏸'; }) 
           .catch(err => console.error("Playback blocked or file missing:", err)); 
       } else { 
         audioTrack.pause(); 
         playBtn.textContent = '▶'; 
       } 
     }); 
   } 

   // Track and update the running time display string
   if (audioTrack && timeDisplay) {
     audioTrack.addEventListener('timeupdate', () => {
       const min = Math.floor(audioTrack.currentTime / 60);
       const sec = Math.floor(audioTrack.currentTime % 60);
       timeDisplay.textContent = `${min}:${sec < 10 ? '0' : ''}${sec}`;
     });
   }

   // Automatically hide the controls if the MP3 file 404s or fails to load
   if (audioTrack) {
     audioTrack.addEventListener('error', () => {
       console.warn(`Audio file missing or broken: ./artwork/${image_audio_name}.mp3`);
       audioPlayerContainer.style.display = 'none';
     }, true); // The 'true' flag ensures the error event is captured from the inner source tag
   }    




    
    
    
      labels = [
            {innerText:'#'},
            {innerText:'Photo'},
            {innerText:'Name'}, 
            {innerText:'Occurrences'},
      ];

      let table = faddelem('table',document.body,{id:'main'});                    
      let thead = faddelem('thead',table);
      let hrow = faddelem('tr',thead);
      
      faddelems('th',hrow,labels);
      let tbody = faddelem('tbody',table);

      for( let i = 0; i < results.length; i++ ) {
           let rec = results[i];
           let brow = faddelem('tr', tbody);
       
           // Column: Index
           faddelem('td', brow, { textContent: i + 1 });

           // Column: Photo
           buildSpeciesPhoto( brow, rec );

           // Column: Name 
           let urlState = setTaxonId(appState, rec.taxon.id);
           if( rec.taxon.ancestor_ids.some(id => id == 47157) ) { urlState = setLSTaxonId(urlState, '47157'); }  // lepidoptera*/
           let url = '';
           if( config.showStudyGrid === 'widget' ) {
               url = '../admin/widget_grid.html' + buildParameterList(urlState) + '&fieldname=' + config.fieldName + '&fieldvalue=' + getPlantId(appState);
           } else {
               url = './garden_grid.html' + buildParameterList(urlState);
           }
           buildSpeciesName( brow, rec, url );
       
           // Column: Count
           faddelem('td', brow, { textContent: rec.count || '' });
      }

      // buttons to go to prev or next page
      let nav = faddelem('div',document.body,{id:'nav'});
      (page_curr<=1)?faddelem('span',nav,{classList:'button_inactive',title:'already on first page',innerHTML:'&laquo'}):faddelem('a',nav,{classList:'button',title:'first page',id:'button_first',innerHTML:'&laquo',href:fpageurl(winurlexsearchstr,winurlparams,per_page,1)});
      (page_prev===null)?faddelem('span',nav,{classList:'button_inactive',title:'no previous page',innerHTML:'&#8249'}):faddelem('a',nav,{classList:'button',title:'previous page',id:'button_prev',innerHTML:'&#8249',href:fpageurl(winurlexsearchstr,winurlparams,per_page,page_prev)});
      (page_next===null)?faddelem('span',nav,{classList:'button_inactive',title:'no next page',innerHTML:'&#8250'}):faddelem('a',nav,{classList:'button',title:'next page',id:'button_next',innerHTML:'&#8250',href:fpageurl(winurlexsearchstr,winurlparams,per_page,page_next)});
      (page_curr>=page_max)?faddelem('span',nav,{classList:'button_inactive',title:'already on last page',innerHTML:'&raquo'}):faddelem('a',nav,{classList:'button',title:'last page',id:'button_last',innerHTML:'&raquo',href:fpageurl(winurlexsearchstr,winurlparams,per_page,page_max)});
   }
   else { faddelem('p',document.body,{innerText:'No results returned.'}); }; 
};
</script>
 
<script type="text/javascript"   src="../core/js/ConfigManager.js"></script>
<script type="text/javascript"   src="../core/js/api_fetch.js"></script>

<script>
 
function setupAPIParams(config) {
   let api_params = '';

   api_params += ('?project_id='+config.insectProject);
   //api_params += '&hrank=species';

   // filter by field... uses the plant_id (the taxon_id) for the plant
   // chosen from the garden list.
   api_params += '&field:'+config.fieldName+'='+getPlantId(appState);

   // default these to what's in the config even though the state sometimes
   // holds the same attributes for other components.
   if( config.userId         ) { api_params += '&user_id='  + config.userId; }
   if( config.faunaAPIParams ) { api_params += config.faunaAPIParams; }

   // if a place_id was chosen from the place drop-down, use that place_id...
   if( getPlaceMenuId(appState) ) {
       api_params += '&place_id=' + getPlaceMenuId(appState);
   } else if( config.defaultPlace ) {
       api_params += '&place_id=' + config.defaultPlace;
   }

   // if a filter has been chosen, get the filter api params
   if( getActivityFilter(appState) ) {
       api_params += getFilterAPIParams(config);
   }

   // if a taxon was chosen from the "Show" drop-down filter with that taxon_id.
   // otherwise, filter with the default from the config file if there is one.
   if( getMenuId(appState) ) {
       api_params += getMenuIdParam(appState, '&taxon_id='); 
   } else {
       if( config.defaultTaxonId ) { api_params += '&taxon_id=' + config.defaultTaxonId; }
   }
 
   api_params += getPageParam(appState, '&page=');
   api_params += '&without_taxon_id='+CONST_WITHOUT_TAXON_PLANTAE; // only interested in visitors to plants here
   api_params += '&per_page='+CONST_SPECIES_COUNTS_PER_PAGE;

   return api_params;
}
 
async function gatherResources() {
  let api_base  = 'https://api.inaturalist.org/v1/observations/species_counts';
  let json_path = json_root + getParams(appState);
 
  try {
   
      // Await the result of getObservations() and store the actual data
      const config  = await asyncGetConfiguration( json_path, getComponent(appState) );
      console.log('full config title: ' + config.getFullTitle());
      const api_params    = setupAPIParams( config );
      const api_url       = api_base+api_params;
      console.log('api url: ' + api_url);
      const obs_data      = await apiFetch( api_url ); 
     
      // Pass the data to the buildPage function
      buildPage(obs_data, config); 

    } catch (error) {
      console.error("An error occurred:", error);
      faddelem('p',document.body,{innerHTML:('<span id="error">&#9888;<br>' + error.message + '</span>')}); 
      throw error;
    }
}

let message = validateGarden(appState);
 
if( message ) {
    faddelem('p',document.body,{innerHTML:('<span id="error">&#9888;<br>' + message + '</span>')}); 
} else {
    gatherResources(); 
}
 
</script>
</body>

</html>
