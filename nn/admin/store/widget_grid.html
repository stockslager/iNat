<style> 
/* for the column header un-filter */ 
.filterable-header a, .filterable-header a:active { color: cornflowerblue; /*color: var(--color-text-link); */ background: transparent; background-color: transparent; text-decoration: none; /* Adds a subtle opacity so it blends nicely in the header, matching your old look */ opacity: 0.7; transition: opacity 0.2s ease, filter 0.2s ease; } 
/* 2. Hover State: Turn off background blocks and amplify the blue color vibrancy */ 
.filterable-header a:hover { color: cornflowerblue; /*color: var(--color-text-link); */ background: transparent; background-color: transparent; text-decoration: none; /* Brings icon to full opacity and injects a 40% vibrancy boost to make the blue pop */ opacity: 1; filter: brightness(1.4); } 
/* 3. Icon Thickness Management */ 
.clear-btn { /* Ensures the custom bold text shadow uses the exact blue dictated by the link above */ text-shadow: 0 0 0.5px currentColor; } 
.clear-all-filters a:active { color: royalblue; /*color: var(--color-text-link); */ background: transparent; background-color: transparent; text-decoration: none; /* Adds a subtle opacity so it blends nicely in the header, matching your old look */ opacity: 0.7; transition: opacity 0.2s ease, filter 0.2s ease; } 
.clear-all-filters a:hover { color: cornflowerblue; /*color: var(--color-text-link); */ background: transparent; background-color: transparent; text-decoration: none; /* Brings icon to full opacity and injects a 40% vibrancy boost to make the blue pop */ opacity: 1; filter: brightness(1.4); } 

/* ==========================================================================
   UPDATED CONTAINER SYSTEM: INVISIBLE GUTTER MATCHING FRAME
   ========================================================================== */

html {
    background-color: #0f172a;
    box-sizing: border-box;
    min-height: 100vh;
    padding: 10px 50px 24px 50px; /* Top, Right, Bottom, Left */
}

body {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    background-color: transparent; 
}

#app {
    background-color: #000000; 
    border: 2px solid #333; 
    border-radius: 5px;
    padding: 0px;
    box-sizing: border-box;
    width: 100%;
    max-width: 100%;
    margin-top: 10px; 
    
    min-height: calc(100vh - 72px); 
}
           
.widget-component-container {
  width: 100%;
  max-width: 100%;
  margin: 0;
  box-sizing: border-box;
}

/* ==========================================================================
   NATIVE LAYOUT FLOW ELEMENTS
   ========================================================================== */

#main, .top-bar, #divhead { 
  width: 100%; 
  max-width: 100%; 
  margin-left: 0; 
  margin-right: 0; 
  box-sizing: border-box; 
} 

.top-bar { 
  display: flex; 
  justify-content: space-between; 
  align-items: stretch; 
  gap: 10px; 
  margin-bottom: 10px; 
} 

/* 4. THE BOXES: Fixed horizontal scroll and standard styling */ 
#stats, #dltest { 
  display: block; 
  box-sizing: border-box; 
  max-height: 64px; 
  overflow-y: auto; 
  overflow-x: hidden; 
  width: fit-content; 
  white-space: nowrap; 
  border: 2px solid var(--color-border); 
  border-radius: 5px; 
  padding: 3px 8px; 
  background: var(--color-base); 
  line-height: 1.2; 
  color: var(--color-text); 
  font: 14px Sans-Serif; 
} 

/* 5. THE SHIELD: Reset internal table tags and remove ALL default underlines */ 
#stats table, #stats td, #stats tr, #dltest table, #dltest td, #dltest tr { 
  border: none; 
  background: transparent; 
  padding: 0 12px 0 0; /* Extra 12px padding to the right for breathing room */ 
  box-shadow: none; 
  color: inherit; 
  font: inherit; 
  text-decoration: none; /* KILLS ALL UNDERLINES IN ALL ROWS */ 
  margin: 0; 
  border-collapse: collapse; 
} 

/* KILL UNDERLINES FOR ALL LINKS IN THE BOXES */ 
#stats a, #dltest a { color: var(--color-text-link); text-decoration: none; } 
#dltest tr:first-child td { text-decoration: underline; } 

/* 6. NAVBAR */ 
.navbar { 
  background-color: var(--color-brand); 
  border-radius: 5px; 
  font-family: Arial, Helvetica, sans-serif; 
  display: flex; 
  align-items: center; 
  min-height: 40px; 
  overflow: hidden; 
} 

.inat-floating-nav { 
  margin-left: -8px; 
  position: -webkit-sticky; /* Safari */ 
  position: sticky; 
  left: 0; 
  bottom: 0; 
  background: var(--color-base-translucent); 
  width: 188px; 
  height: 52px; 
  border-radius: 14px; /* Alignment: Centers the outlined button neatly inside this container */ 
  display: flex; 
  align-items: center; 
  justify-content: center; 
  box-sizing: border-box; 
} 
@media print { .inat-floating-nav { display: none; } } 
.button.inat-wide-button { 
  /* Resets the narrow 32px bounds so the text fits */ 
  width: 168px; 
  height: 36px; 
  margin: 0; /* Inherits native styles */ 
  background: var(--color-alt); 
  border: 1px solid var(--color-border); 
  color: var(--color-text-link); /* Custom Typography */ 
  font-size: 13px; 
  line-height: 1.2; 
  border-radius: 8px; /* Displays and centers multi-line text blocks */ 
  display: flex; 
  align-items: center; 
  justify-content: center; 
  text-align: center; 
  white-space: normal; 
  text-decoration: none; 
  box-sizing: border-box; /* Apply translucency */ 
  opacity: 0.7; 
  transition: opacity 0.2s ease, background 0.2s ease; 
} 
.button.inat-wide-button:hover { opacity: 1.0; background: var(--color-hover); } 

/* ==========================================================================
   WIDGET INHERITANCE AND COLOR THEMING OVERRIDES
   ========================================================================== */

/* 1. Target theme container cleanly using nesting to drop padding/margin hacks */
#app #themeContainer {
    background-color: #000000; 
    padding: 0; 
    margin: 0;
}

/* 2. Target the widget wrappers using its exact composite chain to drop !important */
#themeContainer .inat-widget, 
#themeContainer [data-inat-widget],
#themeContainer div[data-inat-widget] {
    border: none;
    background: transparent;
    box-shadow: none;
    color: #ffffff; /* Sets the default white text variant */
}

/* 3. Increase hyperlink specificity path so the sky blue overrides third-party files */
#app #themeContainer [data-inat-widget] a,
#themeContainer .inat-widget a {
    color: #38bdf8; 
}
           
/* Original Helpers */ 
#h2 { font-weight:bold; font-size:20px; } 
p { width:100%; } 
.npcicon { width:14px; height:14px; border: 1px solid cornflowerblue; padding: 5px; border-radius: 50px; } 
.user_head { align-items: center; justify-content: center; } 
.user { display: inline-flex; align-items: center; white-space: nowrap; gap: 8px; margin-left: 2px; } 
</style>

           
</head>
<body>

    <!-- base anchor -->
    <div id="app"></div>

<script>
//get parameters from the url
let winurlsearchstr   = window.location.search;
let winurlparams      = new URLSearchParams(winurlsearchstr);
let p_mode      = winurlparams.get('mode') || '';           

appState       = buildStateFromParams(winurlparams);
                      
function buildMenu( config ) {

  // Create the main navbar container
  let navbar = document.createElement('div');    
  navbar.className = 'navbar v2-menu';

   // if life stages (ls) option was chosen for map type was set in the config and 
   // they've chosen Butterflies from the drop-down or have chosen a butterfly from the list
   if( config.mapType !== 'hide' ) {
       if( config.mapType === 'ls' && ( getLSTaxonId(appState) === '47157' || getTaxonId(appState) === '47157' || getMenuId(appState) === '47157' ) ) {  
           let links = [];
    
           let mapLink  = faddelem('a', null, { href: './studies_map.html' + buildParameterList(appState) + '&gridmode=widget', textContent: 'Standard Map' });
           let lsLink   = faddelem('a', null, { href: '../.../admin/density_map.html' + buildParameterList(appState), textContent: 'Life-Stages' });

           links.push(mapLink);
           links.push(lsLink);

           buildNavDD( navbar, 'Maps', links );
       } else {   
               let url = './studies_map.html' + buildParameterList(appState) + '&gridmode=widget' + '&fieldname=' + config.fieldName + '&fieldvalue=' + getPlantId(appState);
               buildNavURL( navbar, url, CONST_MAP );
       }
   }

   // Build the Home Link
   let homeUrl = '../../garden/plant_detail.html';
   if( getComponent(appState) === COMPONENT_GARDEN && p_mode === 'flower' ) { 
        let urlState = appState;
        homeUrl = '../../garden/plant_detail.html'; 
        buildNavHome( navbar, homeUrl, urlState, config );
   } else if( getComponent(appState) === COMPONENT_BEDS && p_mode === 'beds' ) {   // if they came in from clicking plant name.
        let urlState = appState;
        homeUrl = '../../beds/beds.html'; 
        buildNavHome( navbar, homeUrl, urlState, config );
   } else if( getComponent(appState) === COMPONENT_GARDEN && p_mode === 'beds' ) {  // if they came in from clicking bug icon, then something on plant_detail
        let urlState = appState;
        urlState = setTaxonId(urlState, '');
        homeUrl = '../../garden/plant_detail.html'; 
        buildNavHome( navbar, homeUrl, urlState, config );
   } else {
        buildNavHome( navbar, homeUrl, appState, config );
   }
  
   let appContainer = document.getElementById('app');
   if( appContainer ) {
       // Inserts the navbar right before the #app element in the DOM tree
       appContainer.parentNode.insertBefore(navbar, appContainer);
   } else {
       // Fallback if #app element isn't found
       document.body.insertBefore(navbar, document.body.firstChild);
   }
}

function setupWidgetParams( config ) {
    let widget_params = '';

    // --- Consolidated iNat Multi-Field API Builder ---
    const initialParams = new URLSearchParams(window.location.search);
    const initialNames = initialParams.getAll('fieldname');
    const initialValues = initialParams.getAll('fieldvalue');

    const lowerCaseNames = initialNames.map(name => name.toLowerCase());

    // Core Rule: If the URL has no active filters (First Entrance), use your config defaults
    if( config.fieldName && !lowerCaseNames.includes(config.fieldName.toLowerCase() ) ) {
        widget_params += '&field:' + config.fieldName;
        if( config.fieldValue ) {
            widget_params += '=' + encodeURIComponent(config.fieldValue);
        }
    }

    // Sequential Loop: Process whatever filters are explicitly remaining in the URL bar
    initialNames.forEach((name, index) => {
      const value = initialValues[index];
      if( name && value ) {
          widget_params += '&field:' + name + '=' + encodeURIComponent(value);
      }
    });

    if( getObsDate(appState)    ) { widget_params += '&on='       + getObsDate(appState); } 

    if( getUser(appState) ) {
        widget_params += '&user_id=' + getUser(appState);
    } else if( config.userId ) { 
        widget_params += '&user_id='  + config.userId; 
    }
 
    if( getPlaceMenuId(appState) ) {
        widget_params += getPlaceMenuIdParam(appState, '&place_id=');
    } else {
        if( config.defaultPlace ) { 
            widget_params += '&place_id='        + config.defaultPlace; 
        } else {
            widget_params += '&place_id=any';
        }
    }

    // filter for life stage annotation...
    if( getLifeStage(appState) ) { 
        if( getLifeStage(appState) === 'null' ) {
            widget_params += '&without_term_id=1';
        } else {
            widget_params += '&term_id=1&term_value_id='  + getLifeStage(appState);
        }
    }

    // if a filter has been chosen, get the filter api params
    if( getActivityFilter(appState) ) {
        widget_params += getFilterAPIParams(config);
    }

    if( config.obsAPIParams ) { widget_params += config.obsAPIParams; }

    // default all of these so they stay consistent across the map and grid.
    // may need to revisit if/when the table sorts by quality_grade.
    widget_params += '&reviewed=any&quality_grade=needs_id,research,casual&verifiable=any';

    return widget_params;
}

function buildWidget( config ) {

    let inatParams = '';
    let paramValues = setupWidgetParams(config) || '';

    // If paging is enabled, safely append it to the internal parameters
    if( config.pagingEnabled ) {
        paramValues += getPageParam(appState, '&page=');
    }

    // Wrap the entire parameter string in a single set of attributes
    if( paramValues ) {
        inatParams = 'data-inat-params="' + paramValues + '" ';
    }          

    let taxonId = '';
    if( getTaxonId(appState) || getMenuId(appState) || config.defaultTaxonId ) {
        taxonId = 'data-inat-taxon="' + (getTaxonId(appState) || getMenuId(appState) || config.defaultTaxonId) + '" '; 
    }

    let compact = '';
    if( p_mode === 'beds' ) {
        compact = 'data-inat-compact="true" ';
    }

    // Form clean single-widget container layout view assignments
    var widgetHtml = 
      '<div id="themeContainer" class="widget-component-container ' + '">' +
        '<div id="inat-widget-container" ' +
            'data-inat-widget ' +
            'data-inat-source="' + config.project + '" ' +
            'data-inat-source-type="project" ' +
            'data-inat-theme="transparent-dark" ' +
            'data-inat-title="' + config.title + '" ' + 
            'data-inat-layout="grid" ' +
            'data-inat-limit="' + CONST_OBSERVATIONS_PER_PAGE + '" ' +
            'data-inat-order-by="created_at" ' +
             inatParams + taxonId + compact + 
            'data-inat-show-title="false" ' + 
            'data-inat-header-text="' + config.title + '" >' + 
        '</div>' +
      '</div>';

    console.log('inat widget parameters - ' + widgetHtml);
           
    // Render the HTML view structure directly to the application mount point
    document.getElementById('app').innerHTML = widgetHtml;

    var scriptNode = document.createElement('script');
    scriptNode.src = '../../core/js/inat_widget.js';
    document.body.appendChild(scriptNode);
}

</script>           
<script type="text/javascript"   src="../../core/js/ConfigManager.js"> </script>
<script>
   
async function gatherResources() {
  let json_path = json_root + getParams(appState);
 
  try {
   
      // Await the result of getObservations() and store the actual data
      const config   = await asyncGetConfiguration( json_path, getComponent(appState), getStudyTitle(appState) );
     
      buildMenu( config );
      buildWidget( config );

    } catch (error) {
      console.error("An error occurred:", error);
      faddelem('p',document.body,{innerHTML:('<span id="error">&#9888;<br>' + error.message + '</span>')}); 
      throw error;
    }
}

let message = validateConfig(appState);
 
if( message ) {
    faddelem('p',document.body,{innerHTML:('<span id="error">&#9888;<br>' + message + '</span>')}); 
} else {
    gatherResources(); 
}
           
</script>
</body>
