<style> 
/* for the column header un-filter */ 
.filterable-header a, .filterable-header a:active { color: cornflowerblue; /*color: var(--color-text-link); */ background: transparent; background-color: transparent; text-decoration: none; /* Adds a subtle opacity so it blends nicely in the header, matching your old look */ opacity: 0.7; transition: opacity 0.2s ease, filter 0.2s ease; } 
/* 2. Hover State: Turn off background blocks and amplify the blue color vibrancy */ 
.filterable-header a:hover { color: cornflowerblue; /*color: var(--color-text-link); */ background: transparent; background-color: transparent; text-decoration: none; /* Brings icon to full opacity and injects a 40% vibrancy boost to make the blue pop */ opacity: 1; filter: brightness(1.4); } 
/* 3. Icon Thickness Management */ 
.clear-btn { /* Ensures the custom bold text shadow uses the exact blue dictated by the link above */ text-shadow: 0 0 0.5px currentColor; } 
.clear-all-filters a:active { color: royalblue; /*color: var(--color-text-link); */ background: transparent; background-color: transparent; text-decoration: none; /* Adds a subtle opacity so it blends nicely in the header, matching your old look */ opacity: 0.7; transition: opacity 0.2s ease, filter 0.2s ease; } 
.clear-all-filters a:hover { color: cornflowerblue; /*color: var(--color-text-link); */ background: transparent; background-color: transparent; text-decoration: none; /* Brings icon to full opacity and injects a 40% vibrancy boost to make the blue pop */ opacity: 1; filter: brightness(1.4); } 

/* ==========================================================================
   UPDATED CONTAINER SYSTEM: INVISIBLE GUTTER MATCHING FRAME
   ========================================================================== */

/* 1. THE GUTTER FRAME (Matches your native layout body bounds) */
/*body { 
  padding-left: 200px; 
  padding-right: 200px; 
  margin: 0; 
  box-sizing: border-box; 
} */
html {
  /* 1. Setup the global theme backdrop layout metrics */
  background-color: #0f172a;               /* Base pitch black workspace canvas */
  box-sizing: border-box;
  min-height: 100vh;
  padding: 24px;                           /* Pushes the border cleanly away from viewport edges */
  padding-left: 50px;                   
  padding-right: 50px;
}

body {
  /* 2. Integrate your required vertical side gutters */
  padding-left: 15px; 
  padding-right: 15px; 
  padding-top: 15px;                       /* Balances text top alignment */
  padding-bottom: 15px;
  margin: 0; 
  box-sizing: border-box; 

  /* 3. Build the smoky transparent dark layout boundary line */
  background-color: rgba(30, 41, 59, 0.4); /* Translucent slate window surface fill */
  border: 1px solid rgba(255, 255, 255, 0.1); /* Fine thinned-out silver accent rule */
  border-radius: 16px;                     /* Smooth curved framing container corners */
  min-height: calc(100vh - 48px);          /* Forces frame to lock perfectly to viewport bounds */
}

/****************/
           
/* 2. THE WIDGET WRAPPER FRAME 
   Intentionally kept seamless (no borders, no backgrounds, no extra padding) 
   so it shares your layout's exact 50px margins without breaking elements. */
.widget-component-container {
  width: 100%;
  max-width: 100%;
  margin: 0;
  box-sizing: border-box;
}

/* ==========================================================================
   NATIVE LAYOUT FLOW ELEMENTS
   ========================================================================== */

/* 2. THE ALIGNMENT */ 
#main, .navbar, .top-bar, #divhead { 
  width: 100%; 
  max-width: 100%; 
  margin-left: 0; 
  margin-right: 0; 
  box-sizing: border-box; 
} 

/* 3. THE TOP BAR */ 
.top-bar { 
  display: flex; 
  justify-content: space-between; 
  align-items: stretch; 
  gap: 10px; 
  margin-bottom: 10px; 
} 

/* 4. THE BOXES: Fixed horizontal scroll and standard styling */ 
#stats, #dltest { 
  display: block; 
  box-sizing: border-box; 
  max-height: 64px; 
  overflow-y: auto; 
  overflow-x: hidden; 
  width: fit-content; 
  white-space: nowrap; 
  border: 2px solid var(--color-border); 
  border-radius: 5px; 
  padding: 3px 8px; 
  background: var(--color-base); 
  line-height: 1.2; 
  color: var(--color-text); 
  font: 14px Sans-Serif; 
} 

/* 5. THE SHIELD: Reset internal table tags and remove ALL default underlines */ 
#stats table, #stats td, #stats tr, #dltest table, #dltest td, #dltest tr { 
  border: none; 
  background: transparent; 
  padding: 0 12px 0 0; /* Extra 12px padding to the right for breathing room */ 
  box-shadow: none; 
  color: inherit; 
  font: inherit; 
  text-decoration: none; /* KILLS ALL UNDERLINES IN ALL ROWS */ 
  margin: 0; 
  border-collapse: collapse; 
} 

/* KILL UNDERLINES FOR ALL LINKS IN THE BOXES */ 
#stats a, #dltest a { color: var(--color-text-link); text-decoration: none; } 
/* RE-ADD UNDERLINE: Only for the very first row of the right box (#dltest) */ 
/* This ensures text-only headers are underlined, but URLs remain clean */ 
#dltest tr:first-child td { text-decoration: underline; } 

/* 6. NAVBAR */ 
.navbar { 
  background-color: var(--color-brand); 
  border-radius: 5px; 
  font-family: Arial, Helvetica, sans-serif; 
  display: flex; 
  align-items: center; 
  min-height: 40px; 
  overflow: hidden; 
} 

/**********/ 
.inat-floating-nav { 
  margin-left: -8px; 
  position: -webkit-sticky; /* Safari */ 
  position: sticky; 
  left: 0; 
  bottom: 0; 
  background: var(--color-base-translucent); 
  width: 188px; 
  height: 52px; 
  border-radius: 14px; /* Alignment: Centers the outlined button neatly inside this container */ 
  display: flex; 
  align-items: center; 
  justify-content: center; 
  box-sizing: border-box; 
} 
@media print { .inat-floating-nav { display: none; } } 
.button.inat-wide-button { 
  /* Resets the narrow 32px bounds so the text fits */ 
  width: 168px; 
  height: 36px; 
  margin: 0; /* Inherits native styles */ 
  background: var(--color-alt); 
  border: 1px solid var(--color-border); 
  color: var(--color-text-link); /* Custom Typography */ 
  font-size: 13px; 
  line-height: 1.2; 
  border-radius: 8px; /* Displays and centers multi-line text blocks */ 
  display: flex; 
  align-items: center; 
  justify-content: center; 
  text-align: center; 
  white-space: normal; 
  text-decoration: none; 
  box-sizing: border-box; /* Apply translucency */ 
  opacity: 0.7; 
  transition: opacity 0.2s ease, background 0.2s ease; 
} 
.button.inat-wide-button:hover { opacity: 1.0; background: var(--color-hover); } 

/* Original Helpers */ 
#h2 { font-weight:bold; font-size:20px; } 
p { width:100%; } 
.npcicon { width:14px; height:14px; border: 1px solid cornflowerblue; padding: 5px; border-radius: 50px; } 
.user_head { align-items: center; justify-content: center; } 
.user { display: inline-flex; align-items: center; white-space: nowrap; gap: 8px; margin-left: 2px; } 
</style>

           
</head>
<body>

    <!-- Base anchor location layout slot -->
    <div id="app"></div>

<script>
// 1. Setup specific single configurations
var taxonId = '47157'; 

// 2. Scan localized browser storage key values to assert default session layout
var savedTheme = localStorage.getItem('app-ui-theme') || 'dark-theme';

// Match the background of the main document canvas frame straight out of the box
if (savedTheme === 'light-theme') {
    document.body.style.backgroundColor = '#f8fafc';
} else {
    document.body.style.backgroundColor = '#0f172a';
}

var initialWidgetTheme = (savedTheme === 'light-theme') ? 'light' : 'transparent-dark';
var btnLabel = (savedTheme === 'dark-theme') ? '☀️ Light Mode' : '🌙 Dark Mode';

// 3. Form clean single-widget container layout view assignments
var widgetHtml = 
    '<div id="themeContainer" class="widget-component-container ' + savedTheme + '">' +
        /*'<div class="widget-header-row" style="display: flex; justify-content: flex-end; padding: 10px 0;">' +
            '<button class="theme-toggle-btn" onclick="toggleTheme()">' + btnLabel + '</button>' +
        '</div>' +*/
        '<div id="inat-widget-container" ' +
            'data-inat-widget ' +
            'data-inat-source="cincinnati-nature-center-at-rowe-woods-oh-usa" ' +
            'data-inat-source-type="project" ' +
            'data-inat-theme="' + initialWidgetTheme + '" ' +
            'data-inat-title="Cincinnati Nature Center at Rowe Woods, OH, USA" ' +
            'data-inat-layout="grid" ' +
            'data-inat-limit="50" ' +
            'data-inat-order-by="observed_on" ' +
            'data-inat-taxon="' + taxonId + '" ' +
            'data-inat-show-title="false"' + 
            'data-inat-header-text="config.studyTitle"' + 
        '</div>' +
    '</div>';

// Render the HTML view structure directly to the application mount point
document.getElementById('app').innerHTML = widgetHtml;

// 4. Inject external iNaturalist custom widget asset dependency immediately
var scriptNode = document.createElement('script');
scriptNode.src = 'https://glauberramos.github.io/inat/inat-widget.js';
document.body.appendChild(scriptNode);

// 5. Global Action Runtime Trigger Logic Operations
window.toggleTheme = function() {
    var container = document.getElementById('themeContainer');
    var toggleBtn = document.querySelector('.theme-toggle-btn');
    var widgetNode = document.getElementById('inat-widget-container');
    
    if (container && toggleBtn && widgetNode) {
        var isDarkNow = container.classList.contains('dark-theme');
        var targetThemeClass = isDarkNow ? 'light-theme' : 'dark-theme';
        var targetBgColor = isDarkNow ? '#f8fafc' : '#0f172a';
        var targetBtnLabel = isDarkNow ? '🌙 Dark Mode' : '☀️ Light Mode';
        var targetWidgetTheme = isDarkNow ? 'light' : 'transparent-dark';
        
        // Execute structural document styling states updates
        container.className = 'widget-component-container ' + targetThemeClass;
        document.body.style.backgroundColor = targetBgColor;
        toggleBtn.innerHTML = targetBtnLabel;
        localStorage.setItem('app-ui-theme', targetThemeClass);
        
        // Update parameter targets directly on our single instance
        widgetNode.setAttribute('data-inat-theme', targetWidgetTheme);
        
        // Signal target vendor frame rebuild processing
        if (window.iNatWidget && typeof window.iNatWidget.init === 'function') {
            window.iNatWidget.init();
        }
    }
};
           
</script>
</body>
</html>
