    <div id="app">

    <script>

function errorMessage( message ) {
    // Target floating info screen container element
    // Check if high-priority error element already exists on screen
    let fallbackAlert = document.getElementById('critical-error-banner');
    
    if (!fallbackAlert) {
        fallbackAlert = document.createElement('div');
        fallbackAlert.id = 'critical-error-banner';

        fallbackAlert.style.position = 'relative';
        fallbackAlert.style.width = '100%'; 
        fallbackAlert.style.boxSizing = 'border-box';
        fallbackAlert.style.marginBottom = '15px'; 
        fallbackAlert.style.padding = '16px 24px';
        fallbackAlert.style.background = '#1e293b'; 
        fallbackAlert.style.border = '2px solid'; 
        fallbackAlert.style.borderRadius = '8px';
        fallbackAlert.style.color = '#ffffff';
        fallbackAlert.style.fontFamily = 'Arial, sans-serif';
        fallbackAlert.style.fontSize = '15px';
        fallbackAlert.style.lineHeight = '1.4';
      
        // Append it directly as the absolute last child of the document frame body
        document.body.appendChild(fallbackAlert);
    }
    
    // Inject the clean configuration message markup safely
    fallbackAlert.innerHTML = `
        <div style="display: flex; align-items: flex-start; gap: 12px;">
            <span style="font-size: 20px; line-height: 1;">⚠️</span>
            <div>
                <span style="color: #f43f5e; font-size: 15px; display: block; margin-bottom: 2px;">Configuration Failure</span>
                <span style="color: #e2e8f0;">${message}</span>
            </div>
        </div>;
}
      
document.addEventListener('DOMContentLoaded', async () => { 
    console.log("--- 1. DOMContentLoaded Fired Successfully ---");
    
    // Parse your state string from the URL 
    let winurlsearchstr = window.location.search; 
    let winurlparams = new URLSearchParams(winurlsearchstr); 
    
    try {
        // Test if the external state engine function is actually completing
        appState = buildStateFromParams(winurlparams); 
    } catch (stateError) {
        console.error("❌ CRASH inside buildStateFromParams():", stateError);
        return;
    }

    // Run your configuration validation check 
    let message = validateConfig(appState); 
    console.log("--- 4. validateConfig Output Message:", message);

    if (message) { 
        errorMessage( message );
        return; // Halt execution safely so gatherResources never fires
    } 
    
    try {
        await gatherResources(); 
        console.log("--- 6. gatherResources() Execution Complete ---");
    } catch (gatherError) {
        console.error("Validation Failure:", message);
        errorMessage((gatherError.message+'<br>Verify that the params parameter has a valid name of a configuration .json file'));
        throw gatherError;
    }

        return; // Halt if configuration setup fails
    } 
    
    // 3. Fetch remote resources and render the map
    await gatherResources();

function setupInatParams( config ) {
    let inat_params = '';

    inat_params += '?project_id='+config.project;

    // if a taxon_id was chosen from a row in the table, use that taxon_id.  if not, 
    // use the menu_id if one was passed in.
    if( getTaxonId(appState) ) {
        inat_params += '&taxon_id='+getTaxonId(appState);
    } else if( getMenuId(appState) ) { 
        inat_params += '&taxon_id=' + getMenuId(appState); 
    } else {
        if( config.defaultTaxonId ) {
            inat_params += '&taxon_id=' + config.defaultTaxonId;
        }
    }

    // --- Consolidated iNat Multi-Field API Builder ---
    const initialParams = new URLSearchParams(window.location.search);
    const initialNames = initialParams.getAll('fieldname');
    const initialValues = initialParams.getAll('fieldvalue');

    const lowerCaseNames = initialNames.map(name => name.toLowerCase());

    // Core Rule: If the URL has no active filters (First Entrance), use your config defaults
    if( config.fieldName && !lowerCaseNames.includes(config.fieldName.toLowerCase() ) ) {
        inat_params += '&field:' + config.fieldName;
        if( config.fieldValue ) {
            inat_params += '=' + encodeURIComponent(config.fieldValue);
        }
    }

    // Sequential Loop: Process whatever filters are explicitly remaining in the URL bar
    initialNames.forEach((name, index) => {
      const value = initialValues[index];
      if( name && value ) {
          inat_params += '&field:' + name + '=' + encodeURIComponent(value);
      }
    });

    if( getObsDate(appState)    ) { inat_params += '&on='       + getObsDate(appState); } 

    if( getUser(appState) ) {
        inat_params += '&user_id=' + getUser(appState);
    } else if( config.userId ) { 
        inat_params += '&user_id='  + config.userId; 
    }
 
    if( getPlaceMenuId(appState) ) {
        inat_params += getPlaceMenuIdParam(appState, '&place_id=');
    } else {
        if( config.defaultPlace ) { 
            inat_params += '&place_id='        + config.defaultPlace; 
        } else {
            inat_params += '&place_id=any';
        }
    }

    // filter for month...
    if( getMonth(appState) ) {
        if( getMonth(appState) !== 'null' ) { 
            inat_params += '&month=' + getMonth(appState);
        }
    } else if( config.defaultMonths ) {
            inat_params += '&month=' + config.defaultMonths;
    }

    // filter for life stage annotation...
    if( getLifeStage(appState) ) { 
        if( getLifeStage(appState) === 'null' ) {
            inat_params += '&without_term_id=1';
        } else {
            inat_params += '&term_id=1&term_value_id='  + getLifeStage(appState);
        }
    }

    // if a filter has been chosen, get the filter api params
    if( getActivityFilter(appState) ) {
        inat_params += getFilterAPIParams(config);
    }

    if( config.obsAPIParams ) { inat_params += config.obsAPIParams; }

    // default all of these so they stay consistent across the map and grid.
    // may need to revisit if/when the table sorts by quality_grade.
    inat_params += '&reviewed=any&quality_grade=needs_id,research,casual&verifiable=any';

    return inat_params;
}

  
async function gatherResources() {
    let json_path = json_root + getParams(appState);
    try {
        // Fetch the remote JSON orientation profile
console.log('one');
        config = await asyncGetConfiguration( json_path, getComponent(appState), getStudyTitle(appState) );
console.log('two');
        // Build your navigation components
        buildMenu(config);
console.log('three');
        // ==========================================================================
        // MAP INITIALIZATION 
        // ==========================================================================
// ADD THIS LOG BLOCK HERE
console.log("--- LEAFLET INITIALIZATION CHECK ---");
console.log("Raw Lat String from Getter:", getCenterLat(config));
console.log("Raw Lng String from Getter:", getCenterLng(config));
console.log("Parsed defaultLat value:", defaultLat);
console.log("Parsed defaultLng value:", defaultLng);
console.log("Parsed defaultZoom value:", defaultZoom);
console.log("-------------------------------------");
        console.log('zoom ' + getDefaultZoom(config));
        const defaultLat  = parseFloat(getCenterLat(config))  || 39.1337;
        const defaultLng  = parseFloat(getCenterLng(config))  || -84.3525;
        const defaultZoom = parseInt(getDefaultZoom(config)) || 12;

        // ========================================================================== 
        // MAP BASE TILES (Street View & Satellite View Options)
        // ========================================================================== 
        const esri = "https://services.arcgisonline.com/arcgis/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}";
        const osm  = "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png";

        const streetView    = L.tileLayer(osm,  { maxZoom: 19, attribution: '&copy; OpenStreetMap contributors' }); 
        const satelliteView = L.tileLayer(esri, { maxZoom: 19, attribution: 'Tiles &copy; Esri &mdash; Source: Esri and the GIS User Community' }); 

        // ==========================================================================
        // CUSTOM OVERLAY FOR DATA COMMUNITIES
        // ==========================================================================

        // Define a custom icon (Red Pushpin)
        const communityPin = L.divIcon({
            html: '<span style="font-size: 26px; line-height: 1;">📍</span>',
            iconSize:    [30, 30], // Square boundary box for the emoji string
            iconAnchor:  [15, 30], // Centers horizontally (15px), anchors near the tip (30px)
            popupAnchor: [0, -26], // Pushes the text description popup cleanly above the pin
            className: 'custom-pin-reset' // Empty class name strips Leaflet's native white box styles
        });

        // Define a custom icon (Green Tinted Pushpin via CSS filter)
        const neighborhoodPin = L.divIcon({
            html: '<span style="font-size: 26px; line-height: 1; display: inline-block; filter: hue-rotate(140deg);">📍</span>',
            iconSize:    [30, 30],
            iconAnchor:  [15, 30], 
            popupAnchor: [0, -26],
            className: 'custom-pin-reset'
        });

        // Initialize an isolated layer group to manage your custom points
        const customLocationsLayer = L.layerGroup();

        // Your unified custom dataset list array
        const customGeoLocations = [
            { lat: 39.1350, lng: -84.3540, name: "Red Landmark", details: "Standard hub", color: "red" },
            { lat: 39.1310, lng: -84.3520, name: "Green Landmark", details: "Special site", color: "green" }
        ];

        customGeoLocations.forEach(spot => {
            // Choose between the community pin (red) or neighborhood pin (green)
            const chosenIcon = (spot.color === 'green') ? neighborhoodPin : communityPin;

            const marker = L.marker([spot.lat, spot.lng], { icon: chosenIcon })
                .bindPopup(`<strong>${spot.name}</strong><br>${spot.details}`);

            // Add the new pin directly to the tracking layer group
            customLocationsLayer.addLayer(marker);
        });

        // ========================================================================== 
        // INATURALIST OVERLAY CONFIGURATION 
        // ========================================================================== 
        let urlParams = setupInatParams(config); 
        console.log('inat url params ' + urlParams); 

        const tileHost = 'https://api.inaturalist.org/v1/points/{z}/{x}/{y}.png';

        // Build distinct, filterable overlay tile pipelines
        const iNatLayers = {
            "Plants 🌿": L.tileLayer(`${tileHost}${urlParams}&iconic_taxa[]=Plantae`, { maxZoom: 20, opacity: 0.85 }),
            "Birds 🐦": L.tileLayer(`${tileHost}${urlParams}&iconic_taxa[]=Aves`, { maxZoom: 20, opacity: 0.85 }),
            "Insects 🦋": L.tileLayer(`${tileHost}${urlParams}&iconic_taxa[]=Insecta`, { maxZoom: 20, opacity: 0.85 }),
            "Mammals 🦊": L.tileLayer(`${tileHost}${urlParams}&iconic_taxa[]=Mammalia`, { maxZoom: 20, opacity: 0.85 }),
            "Fungi 🍄": L.tileLayer(`${tileHost}${urlParams}&iconic_taxa[]=Fungi`, { maxZoom: 20, opacity: 0.85 }),
            "Herps 🐸": L.tileLayer(`${tileHost}${urlParams}&iconic_taxa[]=Amphibia&iconic_taxa[]=Reptilia`, { maxZoom: 20, opacity: 0.85 })
        };

        // ========================================================================== 
        // UNIFIED INSTANCE CONTROL (Cleaned and consolidated)
        // ========================================================================== 

        // Base layer targets menu structure
        const baseMaps = { 
            "Street View": streetView, 
            "Satellite": satelliteView 
        };

        // Initialize Map Instance (We load all taxonomic groups by default on startup)
        const map = L.map('map', { 
            center: [defaultLat, defaultLng], 
            zoom: defaultZoom, 
            layers: [
                streetView, 
                iNatLayers["Plants 🌿"], 
                iNatLayers["Birds 🐦"], 
                iNatLayers["Insects 🦋"], 
                iNatLayers["Mammals 🦊"], 
                iNatLayers["Fungi 🍄"], 
                iNatLayers["Herps 🐸"]
            ] 
        }); 

        // Add the taxonomic checkboxes AND your custom landmarks checkbox to the same menu object
        const overlayMaps = {
            ...iNatLayers,
            "Custom Landmarks 📍": customLocationsLayer
        };

        // Mount single consolidated layout control dashboard panel widget to top right corner
        L.control.layers(baseMaps, overlayMaps, { position: 'topright' }).addTo(map);

        // Force custom landmarks layer to render turned ON by default on bootup
        customLocationsLayer.addTo(map);

        document.getElementById('info').style.display = 'none';

    } catch (error) {
        // Target floating info screen container element
        const infoShield = document.getElementById('info');
        
        if( infoShield ) {
            errorMessage( message );
        } else {
            // Fallback to body injection just in case the container isn't ready
            faddelem('p', document.body, { innerHTML: ('<span id="error">⚠<br>' + message + '</span>') });
        }
    }
}

</script>
