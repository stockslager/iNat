<!DOCTYPE html>  
<html lang="en">
<head> 
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Recently Observed" />
  <meta name="apple-mobile-web-app-title" content="Recently Observed" />
  
  <link rel="apple-touch-icon" sizes="180x180" href="../../core/assets/plant-icon-192.png" />
  <link rel="icon" type="image/png"      href="../../core/assets/plant-icon-96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml"  href="../../core/assets/plant-icon-96.svg" />
  <link rel="shortcut icon"              href="../../core/assets/plant-club.ico" />
  <link rel="manifest"                   href="../../core/assets/plant_club.webmanifest" />
  <!--<link rel="stylesheet" type="text/css" href="../../core/css/core.css" />-->

  <script type="text/javascript" src='../../core/js/common_functions.js'></script>
  <script type="text/javascript" src='../../core/js/study_store.js'></script>
  <script type="text/javascript" src="../../core/js/ConfigManager.js"></script>
    
    <style>
        /* Global Background Reset Resetting to Dark Baseline */
        body {
            background-color: #0f172a;
            margin: 0;
            padding: 20px;
            transition: background-color 0.2s ease;
        }

        /* Master Container Layout Framework */
        .tab-component-container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            box-sizing: border-box;
            font-family: sans-serif;
            transition: background-color 0.2s ease;
        }

        /* --- DARK THEME STYLING CONFIGURATION --- */
        .tab-component-container.dark-theme {
            background-color: #0f172a;
        }
        .dark-theme .tab-header-track {
            border-bottom: 1px solid #334155;
        }
        .dark-theme .custom-tab-header {
            background-color: #0f172a;
            color: #94a3b8;
            border: 1px solid #334155;
            border-bottom: none;
        }
        .dark-theme .custom-tab-header.active-tab {
            background-color: #1e293b;
            color: #38bdf8;
        }
        .dark-theme .custom-tab-content {
            border: 1px solid #334155;
            background-color: #1e293b;
        }

        /* --- LIGHT THEME STYLING CONFIGURATION --- */
        .tab-component-container.light-theme {
            background-color: #f8fafc;
        }
        .light-theme .tab-header-track {
            border-bottom: 1px solid #cbd5e1;
        }
        .light-theme .custom-tab-header {
            background-color: #e2e8f0;
            color: #64748b;
            border: 1px solid #cbd5e1;
            border-bottom: none;
        }
        .light-theme .custom-tab-header.active-tab {
            background-color: #ffffff;
            color: #0284c7;
        }
        .light-theme .custom-tab-content {
            border: 1px solid #cbd5e1;
            background-color: #ffffff;
        }

        /* --- STRUCTURAL INTERFACE MECHANICS --- */
        .tab-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .tab-header-track {
            padding-bottom: 0;
            flex-grow: 1;
        }

        .custom-tab-header {
            display: inline-block;
            padding: 10px 20px;
            margin-right: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            border-radius: 6px 6px 0 0;
            transition: all 0.15s ease;
        }

        .custom-tab-content {
            display: none;
            width: 100%;
            height: 680px;
            border-radius: 0 0 6px 6px;
            overflow: auto; 
            padding: 20px;
            box-sizing: border-box;
        }

        .custom-tab-content.active-panel {
            display: block;
        }

        .tab-widget-frame {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Interactive Theme Action Trigger Element Button */
        .theme-toggle-btn {
            padding: 8px 14px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            border-radius: 20px;
            border: 1px solid #334155;
            background-color: #1e293b;
            color: #e2e8f0;
            transition: all 0.2s ease;
        }

        .light-theme .theme-toggle-btn {
            background-color: #ffffff;
            color: #1e293b;
            border: 1px solid #cbd5e1;
        }
    </style>
</head>
<body>
  <!-- Base anchor location layout slot -->
  <div id="app"></div>
  <script>
    // Parse your state string from the URL
    let winurlsearchstr = window.location.search;
    let winurlparams = new URLSearchParams(winurlsearchstr);
    let p_params = winurlparams.get('params') || 'nnn';
    appState = buildStateFromParams(winurlparams);

    // main function to build the tabs
    function buildTabs( config ) {
      // 1. Setup configurations mapped to matching iNaturalist parameters
      var tabConfig = [
        { id: 'tab1', label: 'Butterflies', taxon: '47157' },
        /* 
        { id: 'tab2', label: 'Bees', taxon: '47222' },
        { id: 'tab3', label: 'Beetles', taxon: '47208' },
        { id: 'tab4', label: 'Birds', taxon: '3' },
        { id: 'tab5', label: 'Herps', taxon: '20978,26036' },
        { id: 'tab6', label: 'Mammals', taxon: '40151' },
        { id: 'tab7', label: 'Mushrooms', taxon: '47170' },
        { id: 'tab8', label: 'Plants', taxon: '47126' },
        { id: 'tab9', label: 'Snails', taxon: '47115' }, 
        */
        { id: 'tab10', label: 'Spiders', taxon: '47118' }
      ];

      var savedTheme = localStorage.getItem('app-ui-theme') || 'dark-theme';
      document.body.style.backgroundColor = (savedTheme === 'light-theme') ? '#f8fafc' : '#0f172a';

      var tabHeadersHtml = '';
      var tabContentsHtml = '';

      // 2. Render completely clean placeholder panels
      for (var i = 0; i < tabConfig.length; i++) {
        var tab = tabConfig[i];
        var isFirst = (i === 0);
        var headerClass = isFirst ? 'custom-tab-header active-tab' : 'custom-tab-header';
        var contentClass = isFirst ? 'custom-tab-content active-panel' : 'custom-tab-content';
        
        tabHeadersHtml += '<div id="header_' + tab.id + '" class="' + headerClass + '" onclick="switchTab(\'' + tab.id + '\')">' + tab.label + '</div>';
        tabContentsHtml += '<div id="content_' + tab.id + '" class="' + contentClass + '"></div>';
      }

      var btnLabel = (savedTheme === 'dark-theme') ? '☀ Light Mode' : '🌙 Dark Mode';
      var tabsWrapperHtml = '<div id="themeContainer" class="tab-component-container ' + savedTheme + '">' +
                              '<div class="tab-header-row">' +
                                '<div class="tab-header-track">' + tabHeadersHtml + '</div>' +
                                '<button class="theme-toggle-btn" onclick="toggleTheme()">' + btnLabel + '</button>' +
                              '</div>' +
                              '<div>' + tabContentsHtml + '</div>' +
                            '</div>';

      document.getElementById('app').innerHTML = tabsWrapperHtml;

      // 3. Isolated Native Fetch Manager (Zero External Dependencies)
      async function fetchAndRenderTab(targetConfig, containerElement) {
        containerElement.innerHTML = '<div class="inat-loading" style="padding: 20px; color: #888;">Loading observations...</div>';
        
        // Build iNaturalist open API data string safely
        var apiUrl = 'https://inaturalist.org?' +
                     'project_id=' + encodeURIComponent(config.project) +
                     '&taxon_id=' + encodeURIComponent(targetConfig.taxon) +
                     '&order_by=observed_on&per_page=12';
        
        try {
          const response = await fetch(apiUrl);
          if (!response.ok) throw new Error('Network failure');
          const data = await response.json();
          
          if (!data.results || data.results.length === 0) {
            containerElement.innerHTML = '<div style="padding:20px; color:#888;">No recent observations found.</div>';
            return;
          }

          // Build custom card grid framework manually
          let titlePrefix = config.title ? (config.title + ' - ') : '';
          let gridHtml = '<div class="inat-widget-title" style="padding:10px 0; font-weight:bold;">' + titlePrefix + 'Recently Observed</div>';
          gridHtml += '<div class="inat-cards-grid" style="display:grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap:16px; padding:10px 0;">';
          
          data.results.forEach(obs => {
            // Locate photo fallback asset chain cleanly
            let photoUrl = 'https://inaturalist.org';
            if (obs.photos && obs.photos.length > 0) {
              photoUrl = obs.photos[0].url.replace('square', 'medium');
            }
            
            let speciesName = obs.species_guess || 'Unknown Organism';
            let observedDate = obs.observed_on_string || 'Unknown Date';
            let obsUrl = obs.uri || `https://inaturalist.org{obs.id}`;

            gridHtml += `
              <div class="inat-card" style="background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); border-radius:8px; overflow:hidden; display:flex; flex-direction:column;">
                <a href="${obsUrl}" target="_blank" style="text-decoration:none; color:inherit;">
                  <div style="background-image:url('${photoUrl}'); background-size:cover; background-position:center; height:150px; width:100%;"></div>
                  <div style="padding:12px; flex-grow:1;">
                    <div style="font-weight:bold; font-size:14px; margin-bottom:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${speciesName}</div>
                    <div style="font-size:12px; color:#888;">${observedDate}</div>
                  </div>
                </a>
              </div>`;
          });
          
          gridHtml += '</div>';
          containerElement.innerHTML = gridHtml;
          
        } catch (error) {
          console.error(error);
          containerElement.innerHTML = '<div style="padding:20px; color:#ef4444;">⚠️ Failed to load observations.</div>';
        }
      }

      // 4. Stable, Clean Tab Switcher
      window.switchTab = function(activeTabId) {
        var headers = document.querySelectorAll('.custom-tab-header');
        var contents = document.querySelectorAll('.custom-tab-content');

        for (var j = 0; j < headers.length; j++) { headers[j].classList.remove('active-tab'); }
        for (var k = 0; k < contents.length; k++) { contents[k].classList.remove('active-panel'); }

        var activeHeader = document.getElementById('header_' + activeTabId);
        var activeContent = document.getElementById('content_' + activeTabId);

        if (activeHeader && activeContent) {
          activeHeader.classList.add('active-tab');
          activeContent.classList.add('active-panel');

          var targetConfig = tabConfig.find(function(t) { return t.id === activeTabId; });
          
          // LAZY FETCH TRIGGER: Execute network dispatch call only if the element is empty
          if (targetConfig && !activeContent.innerHTML.trim()) {
            fetchAndRenderTab(targetConfig, activeContent);
          }
        }
      };

      // 5. Native Theme Switcher (No layout flashes or double reloads)
      window.toggleTheme = function() {
        var container = document.getElementById('themeContainer');
        var toggleBtn = document.querySelector('.theme-toggle-btn');
        
        if (container && toggleBtn) {
          var isDarkNow = container.classList.contains('dark-theme');
          var targetThemeClass = isDarkNow ? 'light-theme' : 'dark-theme';
          document.body.style.backgroundColor = isDarkNow ? '#f8fafc' : '#0f172a';
          toggleBtn.innerHTML = isDarkNow ? '🌙 Dark Mode' : '☀ Light Mode';
          container.className = 'tab-component-container ' + targetThemeClass;
          localStorage.setItem('app-ui-theme', targetThemeClass);
        }
      };

      // Run initialization trigger on first element instantly
      window.switchTab(tabConfig[0].id);
    }

    async function gatherResources() {
      let json_path = '../../core/json/' + p_params;
      try {
        const config = await asyncGetConfiguration(json_path, getComponent(appState), getStudyTitle(appState));
        buildTabs( config );
      } catch (error) {
        console.error("An error occurred:", error);
        document.body.innerHTML = '<div style="background:#1e293b; color:#e2e8f0; font-family:sans-serif; padding:24px; margin:20px;">⚠️ Data Load Error</div>';
      }
    }
    gatherResources();
  </script>
</body>
</html>
