  <script>
    // Parse your state string from the URL 
    let winurlsearchstr = window.location.search; 
    let winurlparams   = new URLSearchParams(winurlsearchstr); 
    let p_params       = winurlparams.get('params') || 'nnn';
    let p_mode         = winurlparams.get('mode') || 'all';
    let p_default_lat  = winurlparams.get('defaultlat') || '';
    let p_default_lon  = winurlparams.get('defaultlon') || '';
    let p_default_zoom = winurlparams.get('defaultzoom') || '';
    let p_tag          = winurlparams.get('tag') || '';
    let p_pinner       = winurlparams.get('pinner') || '';
    let p_layer        = winurlparams.get('layer') || '';

    let map;
    let config     = null;
    let obs_data   = '';

    function buildMenu( config ) {
       // Create the main navbar container fresh
       let navbar = document.createElement('div');
       navbar.className = 'navbar v2-menu';

       // Build the Title natively via your framework to preserve layout styles
       buildNavURL( navbar, './map.html?params='+p_params+'&mode='+p_mode, config.title );

       // ==========================================================================
       // DEVICE-AWARE INTERCEPT HANDLER
       // ==========================================================================
       navbar.addEventListener('click', function(e) {
           const titleLink = e.target.closest('a');
   
           if (titleLink) {
               // Check Device Type: If it is a mobile touchscreen, do NOT cancel the click
               const isMobileTouch = window.matchMedia('(hover: none)').matches;
           
               if (isMobileTouch) {
                   return; // Let standard native link page navigation happen flawlessly
               }

               // DESKTOP ONLY: Intercept and perform the smooth Leaflet zoom animation
               e.preventDefault(); 

               if (window.map) {
                   const defaultZoom  = config.defaultMapZoom || 12;
                   const centerCoords = config.getParsedCenter();
                   const defaultLat = (centerCoords ? centerCoords.lat : 39.1337);
                   const defaultLng = (centerCoords ? centerCoords.lng : -84.3525);   

                   window.map.flyTo([defaultLat, defaultLng], defaultZoom, {
                       animate: true,
                       duration: 1.2 
                   });
               } else {
                   window.location.href = titleLink.href;
               }
           }
       });
       // ==========================================================================

       let appContainer = document.getElementById('app');
       if( appContainer ) {
           document.body.insertBefore(navbar, appContainer);
       } else {
           document.body.insertBefore(navbar, document.body.firstChild);
       }
    }
    
  </script>

<script>

let thresholdZoom = '';
const flowerLocationsLayer = L.layerGroup();
const trailLayers = {}; 
  
// Define the tile layer instances globally so the zoom handler can see them
const esri = "https://services.arcgisonline.com/arcgis/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}";
const osm  = "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png";

const streetView    = L.tileLayer(osm,  { maxZoom: 19, attribution: '&copy; OpenStreetMap contributors' }); 
const satelliteView = L.tileLayer(esri, { maxZoom: 19, attribution: 'Tiles &copy; Esri &mdash; Source: Esri and the GIS User Community' }); 

document.addEventListener('DOMContentLoaded', async () => { 
    console.log("--- 1. DOMContentLoaded Fired Successfully ---");
        
    try {
        await gatherResources(); 
        console.log("--- 6. gatherResources() Execution Complete ---");
    } catch (gatherError) {
        console.log('⚠️ Error ~ ' + gatherError.message);
        document.body.innerHTML = '<div style="background:#1e293b; color:#e2e8f0; font-family:sans-serif; padding:24px; border:2px solid #334155; border-radius:8px; margin:20px;">⚠️ Configuration Failure: ' + message + '</div>';
        return;     
    }
});

function buildFlowerBedURL( config, rec ) {

      let garden = 'pylon';
      // find the garden specified in the garden bed obs field.
      for( let i=0; i<rec.ofvs.length; i++ ) {
           if( rec.ofvs[i].field_id.toString() === '12337' ) {
               garden = rec.ofvs[i].value.toString();
           }
      }

      let map_params = ''; 
      if( p_pinner ) { map_params += ( '&pinner=' + p_pinner ); }
      if( p_layer  ) { map_params += ( '&layer='  + p_layer ); }

      // get the raw audio url from iNat: "https://static.inaturalist.org/sounds/229366.m4a?1621685446"
      let sound_param = '';
      if (rec.sounds && rec.sounds.length > 0) {
         sound_param += ('&soundurl=' + rec.sounds[0].file_url);
      } 

      return( '../../beds/beds.html?params=horizon&component=beds&garden='+garden+'&mode=' + p_mode + map_params +
                                             '&photoid=' + rec.observation_photos[0].photo_id + sound_param + 
                                             '&defaultlat=' + p_default_lat + 
                                             '&defaultlon=' + p_default_lon + 
                                             '&defaultzoom=' + p_default_zoom );
}

function buildFlowerURL( config, rec ) {
  // Instantly locks the taxonId value exclusively to this specific instance
  let plant_id   = rec.taxon.id ? '&plantid='   + rec.taxon.id : '';
  let plant_name = '&plantname=' + (rec.taxon.preferred_common_name || rec.taxon.name || 'unknown name');

  let map_params = '';
  if( p_pinner ) { map_params += ( '&pinner=' + p_pinner ); }
  if( p_layer  ) { map_params += ( '&layer='  + p_layer ); }

  // get the raw audio url from iNat: "https://static.inaturalist.org/sounds/229366.m4a?1621685446"
  let sound_param = '';
  if (rec.sounds && rec.sounds.length > 0) {
     sound_param += ('&soundurl=' + rec.sounds[0].file_url);
  } 
  
  return( '../../garden/plant_detail.html?params=horizon&component=plants&mode=' + p_mode + map_params +
                                             plant_id + plant_name + 
                                             '&photoid=' + rec.observation_photos[0].photo_id + sound_param + 
                                             '&defaultlat=' + p_default_lat + 
                                             '&defaultlon=' + p_default_lon + 
                                             '&defaultzoom=' + p_default_zoom );
}


/**
 * Processes config parent pins, builds Leaflet markers, and binds layer events.
 * @param {L.Map} map - The active Leaflet map instance.
 * @param {MapConfiguration} config - The loaded configuration object.
 * @param {L.LayerGroup} parentLocationsLayer - The parent tracking layer group.
 * @param {Array} mySavedMarkers - Shared array reference caching your markers.
 */
function buildParentPinsLayer(map, config, parentLocationsLayer, mySavedMarkers) {
  // Clear out arrays and groups first to prevent duplicate stacking bugs
  mySavedMarkers.length = 0;
  parentLocationsLayer.clearLayers();

  // ==========================================================================
  // CUSTOM OVERLAY FOR DATA COMMUNITIES (Green Pins)
  // ==========================================================================
  const bigWidth  = 12;
  const bigHeight = 12;
  const halfX     = 6;

  // A totally naked HTML element with zero inline styles to override
  const parent_utf8 = '<span class="parent-utf8-pin">🌟</span>';

  const communityPin = L.divIcon({ 
      html: parent_utf8, 
      iconSize: [bigWidth, bigHeight], 
      iconAnchor: [halfX, bigHeight], 
      popupAnchor: [0, -12], 
      className: 'custom-pin-reset' 
  });

  // Loop through your data structures natively
  config.parentPins.forEach(parentPin => {
    if (parentPin.lat && parentPin.lon) {
      const marker = L.marker([parentPin.lat, parentPin.lon], { icon: communityPin });
      
      // 🌟 AUTOMATIC ZOOM INTERCEPT
      marker.on('click', function(e) {
          console.log("🎯 PARENT PIN CLICKED: Zooming in smoothly to parent position...");

          // Stop Leaflet from passing the click through to background map elements
          if (e && e.originalEvent) {
              L.DomEvent.stopPropagation(e.originalEvent);
              e.originalEvent.preventDefault();
          }

          // 1. Determine which URL to route to based on mode
          let targetURL = '';
          if (p_mode === 'plants') {
              targetURL = buildPlantsURL(parentPin);
          } else if (p_mode === 'activity') {
              targetURL = buildInsectActivityURL(parentPin);
          }

          // Extract active coordinates dynamically from the event object
          // Handles Leaflet click events (e.latlng) or direct marker instance lookups
          const currentLat = e.latlng ? e.latlng.lat : e.target.getLatLng().lat;
          const currentLon = e.latlng ? e.latlng.lng : e.target.getLatLng().lng;
          const currentZoom = 16; 
        
          // delete any lat/lon zoom parameters from previous zooms before
          // zooming to the parent lat / lon
          winurlparams.set('defaultlat', currentLat);
          winurlparams.set('defaultlon', currentLon);
          winurlparams.set('defaultzoom', currentZoom);

          // Push the updated parameters straight into the browser URL bar
          window.history.replaceState(null, '', '?' + winurlparams.toString());

          // Animate map zoom straight into the parent coordinate
          // Your 'zoomend' handler will catch this flight midway and swap views natively!
          map.flyTo(e.latlng, 16, {
              animate: true,
              duration: 1.2
          });

          // 3. Delay redirect until the zoom flight animation completely finishes
          setTimeout(function() {
              if (targetURL) {
                  window.location.href = targetURL;
              }
          }, 1400);
      });
      
      // Keep your child link identifier tags intact
      marker.parentIdentifier = parentPin.name;
      
      mySavedMarkers.push(marker);
      parentLocationsLayer.addLayer(marker);
    }
  });
}

/**
 * Monitors map zoom movements and automatically toggles the visibility 
 * of the flower pins layer and swaps base map views natively.
 * @param {L.Map} map - The live active Leaflet map instance.
 * @param {MapConfiguration} config - The loaded map configuration class instance.
 */
function initializeZoomViewHandler(map, config) {

  map.on('zoomend', () => {
    const currentZoom = map.getZoom();

    if (currentZoom >= thresholdZoom) {
      // Reveal flower pins layer
      if (!map.hasLayer(flowerLocationsLayer)) {
        map.addLayer(flowerLocationsLayer);
      }
      
      // Swaps base views smoothly to Satellite photography
      if (map.hasLayer(streetView)) {
        map.removeLayer(streetView);
        map.addLayer(satelliteView);
        
        // Update pin styling themes to match satellite visibility
        document.querySelectorAll('.custom-utf8-pin').forEach(el => {
          el.classList.remove('default-theme');
          el.classList.add('satellite-theme');
        });
      }
      
    } else {
      // Strip out flower pins layer group
      if (map.hasLayer(flowerLocationsLayer)) {
        map.removeLayer(flowerLocationsLayer);
      }
      
      // Revert back to the clean Street View map lines
      if (map.hasLayer(satelliteView)) {
        map.removeLayer(satelliteView);
        map.addLayer(streetView);
        
        // Revert pin styling themes back to the default layout parameters
        document.querySelectorAll('.custom-utf8-pin').forEach(el => {
          el.classList.remove('satellite-theme');
          el.classList.add('default-theme');
        });
      }
    }
  });
}

/**
 * Filters iNaturalist observations to find only those pins added 
 * by a specific user (the pinner), ensuring the observation contains valid location data.
 */
function filterObservationsByPinner(config, obs_data) {
  // Guard clause if data is missing or empty
  if (!obs_data || !Array.isArray(obs_data)) return [];

  // If p_pinner is completely empty, pass everything with a location string straight through
  if (!p_pinner) {
    return obs_data.filter(obs => obs && obs.location);
  }

  // Parse p_pinner into a clean array of lowercase username slugs
  const pinnerUsernames = p_pinner
    .split(',')
    .map(username => username.trim().toLowerCase())
    .filter(username => username !== '');

  // Add any observation whose project adding user matches one of our slugs
  return obs_data.filter(obs => {
    if (!obs || !obs.location) return false;
    if (!obs.project_observations) return false;

    return obs.project_observations.some(projObs => {
      // Safely extract the adder username string
      const adderUsername = projObs.user?.login ? String(projObs.user.login).toLowerCase() : '';

      // Check if our array includes this username
      return pinnerUsernames.includes(adderUsername);
    });
  });
}

/**
 * Dynamically loads map layers based on trail name
 */
function loadLayers(obs_data) {
  const actualArray = (obs_data && obs_data.results) ? obs_data.results : obs_data;

  // find only the pins added by the user who added them when p_pinner is present
  const obs_by_pinner = filterObservationsByPinner(config, actualArray);
  
  // Use the filtered array directly with a safe fallback loop container
  //const records = actualArray;
  const records = obs_by_pinner || [];
  
  for (let i = 0; i < records.length; i++) {
      let rec = records[i];
      if (!rec || !rec.ofvs) continue;

      let trailName = 'Not Specified'; // Fallback container name

      // Extract the unique trail name using field_id 1019
      for (let j = 0; j < rec.ofvs.length; j++) {
          if (rec.ofvs[j].field_id === 1019) {   // trail name
              trailName = capitalizeWords(rec.ofvs[j].value.toString());
              break;
          }
      }

      // Filter: If p_layer parameter is provided, skip this record if the trail name doesn't match
      if (p_layer.toLowerCase() && trailName.toLowerCase().trim() !== p_layer.toLowerCase() ) {
          continue;
      }
    
      // Dynamically create the trail layer group if it doesn't exist yet
      if (!trailLayers[trailName]) {
          trailLayers[trailName] = L.layerGroup();

          flowerLocationsLayer.addLayer(trailLayers[trailName]);
      }
      
      // Create the pin using your original logic (matching your page mode icon rules)
      const [lat, lon] = rec.location.split(',');
      
      // Look up target zoom level globally or default it safely to frame the pin
      const initialTheme = (typeof defaultZoom !== 'undefined' && typeof thresholdZoom !== 'undefined' && defaultZoom >= thresholdZoom) 
          ? 'satellite-theme' 
          : 'default-theme';
          
      const flowerIcon = L.divIcon({
        html: '<span class="custom-utf8-pin satellite-theme"><span class="flower-glyph">' + '🌼' + '</span></span>',
        iconSize: [16, 16],
        iconAnchor: [8, 8],
        popupAnchor: [0, -16],
        className: 'custom-pin-reset'
      });

      const flowerMarker = L.marker([parseFloat(lat), parseFloat(lon)], { 
          icon: flowerIcon,
          interactive: true,
          bubblingMouseEvents: false
      });
          
      // Click redirection logic
      flowerMarker.on('click', function(e) {
          if (e && e.originalEvent) {
              L.DomEvent.stopPropagation(e.originalEvent);
              e.originalEvent.preventDefault();
          }

          let targetURL = '';
          try {
              if (p_mode === 'plants') {
                  targetURL = typeof buildPlantsURL === 'function' ? buildPlantsURL(rec, config) : '#';
              } else if (p_mode === 'activity') {
                  targetURL = typeof buildInsectActivityURL === 'function' ? buildInsectActivityURL(rec, config) : '#';
              } else if (p_mode === 'beds') {
                  targetURL = typeof buildFlowerBedURL === 'function' ? buildFlowerBedURL(config, rec) : '#';
              } else if (p_mode === 'flower') {
                  targetURL = typeof buildFlowerURL === 'function' ? buildFlowerURL(config, rec) : '#';
              }
          } catch (urlError) {
              console.error("URL Parsing Error: ", urlError);
          }

          if (targetURL && targetURL !== '#') {
              window.location.href = targetURL;
          }
      });

      // Drop the marker into its matching trail layer group container
      trailLayers[trailName].addLayer(flowerMarker);
  }
}
  
</script>

<script>
      
async function gatherResources() {
    let json_path = '../../core/json/maps/' + p_params + '.json';
  
    try { 
        // Fetch, parse, and instantiate the map configuration object in one shot
        config = await MapConfiguration.loadFromUrl(json_path);

        if( p_mode === 'flower' ) {
            let api_base   = 'https://api.inaturalist.org/v1/observations'
            let inat_params = '';
            if( config.pinsProject ) { inat_params += '?project_id=' + config.pinsProject; }
            inat_params += '&field:pin+type=flower';

            const api_url        = api_base+inat_params;
            console.log('api url: ' + api_url);
            obs_data             = await apiFetch( api_url ); 
        }

        if( p_mode === 'beds' ) {
            let api_base   = 'https://api.inaturalist.org/v1/observations'
            let inat_params = '';
            if( config.pinsProject ) { inat_params += '?project_id=' + config.pinsProject; }
            inat_params += '&field:pin+type=beds';

            const api_url        = api_base+inat_params;
            console.log('api url: ' + api_url);
            obs_data             = await apiFetch( api_url ); 
        }
      
        // ==========================================================================
        // MAP INITIALIZATION 
        // ==========================================================================
        const defaultZoom  = p_default_zoom || config.defaultMapZoom || 12;
        const centerCoords = config.getParsedCenter();

        const defaultLat = p_default_lat || (centerCoords ? centerCoords.lat : 39.1337);
        const defaultLng = p_default_lon || (centerCoords ? centerCoords.lng : -84.3525);   

        // Pull the custom zoom limit dynamically straight from your loaded JSON config
        thresholdZoom = config.showUnderZoomLevel || 15;

        // Declare Persistent Global Layer Groups and Marker Arrays
        const parentLocationsLayer = L.layerGroup();
        let mySavedMarkers = [];

        // Initialize Core Leaflet Map View Window
        //const baseMaps = { "Street View": streetView, "Satellite": satelliteView };
        const baseMaps = {};
        const map = L.map('map', {
          center: [defaultLat, defaultLng],
          zoom: defaultZoom,
          layers: [ defaultZoom >= thresholdZoom ? satelliteView : streetView ]
        });
        window.map = map; // Expose globally for references

        // 🌸 zoom handler for conditional display of flower pins
        initializeZoomViewHandler(map, config);
      
        // Generate parent marker overlays
        buildParentPinsLayer(map, config, parentLocationsLayer, mySavedMarkers);
      
        // 🌟 LOAD TRAIL LAYERS DYNAMICALLY AFTER MAP IS COMPLETELY READY
        if (typeof loadLayers === 'function' && obs_data) {
           loadLayers(obs_data); 
           
           // Ensure the main master container respects your zoom threshold state on page boot
           if (defaultZoom >= thresholdZoom) {
               flowerLocationsLayer.addTo(map);
           }
        }

        // Mount UI Controls and Layer Checkboxes
        map.getContainer().classList.remove('hide-first-rule');

        const overlayMaps = {};
      
        // 🌟 Programmatically generate interactive layer checkboxes for each discovered trail
        for (let trail in trailLayers) {
            overlayMaps[trail] = trailLayers[trail];
        }

        // Mount control grid interface panels
        //const layerControl = L.control.layers(baseMaps, overlayMaps, { position: 'topright' }).addTo(map);
        // trailLayers acts as the base map, forcing radio buttons
        const layerControl = L.control.layers(trailLayers, null, { position: 'topright' }).addTo(map);

        // Extract the physical HTML block Leaflet built for the container
        const controlContainer = layerControl.getContainer();

        // Create a clean text title element
        const menuTitle = document.createElement('div');
        menuTitle.className = 'layer-menu-title';
        menuTitle.innerHTML = 'Trail Name'; 

        // Inject it right at the very top of the layout panel box
        controlContainer.insertBefore(menuTitle, controlContainer.firstChild);

        parentLocationsLayer.addTo(map);

        // Base Layer Visual Theme Toggle Listeners
        map.on('baselayerchange', function(e) {
          const pins = document.querySelectorAll('.custom-utf8-pin');
          if (e.name === 'Satellite') {
            pins.forEach(el => { el.classList.remove('default-theme'); el.classList.add('satellite-theme'); });
          } else {
            pins.forEach(el => { el.classList.remove('satellite-theme'); el.classList.add('default-theme'); });
          }
        });

        // Build your navigation components
        buildMenu(config);

        document.getElementById('info').style.display = 'none';
      
    } catch (error) { 
      console.error("An error occurred:", error); 
      const errMsg = error.message || "An unknown retrieval error occurred.";
    
      document.body.innerHTML = '<div style="background:#1e293b; color:#e2e8f0; font-family:sans-serif; padding:24px; border:2px solid #334155; border-radius:8px; margin:20px;">⚠️ Data Load Error: ' + errMsg + '</div>';
    }
}

</script>
</body>
