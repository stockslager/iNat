function escapeHtml(str) { 
    if (!str) return ''; 
    return str 
        .replace(/&/g, '&amp;') 
        .replace(/</g, '&lt;') 
        .replace(/>/g, '&gt;') 
        .replace(/"/g, '&quot;') 
        .replace(/'/g, '&#39;'); 
}
           
// Opens the modal and injects the text
function openNoteModal(element) {
    const fullNote = element.getAttribute('data-full-note');
    const relatedUrl = element.getAttribute('data-related-url');
    
    const textTarget = document.getElementById('globalNoteModalText');
    
    // 1. Set the main description safely as plain text
    textTarget.innerText = fullNote; 
    
    // 2. Append the link dynamically as HTML if it exists
    if (relatedUrl) {
        textTarget.innerHTML += relatedUrl;
    }
    
    document.getElementById('globalNoteModal').style.display = 'flex';
}

// Closes the modal
function closeNoteModal() {
  document.getElementById('globalNoteModal').style.display = 'none';
}

// Close the modal when clicking outside the content area
window.addEventListener('click', function(event) {
  const modal = document.getElementById('globalNoteModal');
  if (event.target === modal) {
    closeNoteModal();
  }
});
          
function replaceDoubleQuotes(str) {
  return str.replace(/"/g, '%22');
}

function furl2(url, txt = url) {
    // 1. Block malicious javascript: protocols
    const safeUrl = url.trim().toLowerCase().startsWith('javascript:') ? '#' : url;
    
    // 2. Escape both variables so they can safely sit inside an HTML string
    const escapedUrl = escapeHtml(safeUrl);
    const escapedTxt = escapeHtml(txt);
    
    // 3. Return the raw HTML string
    return '<a href="' + escapedUrl + '">' + escapedTxt + '</a>';
}

function furl_out(config, url, txt = url) {
    // 1. Block malicious javascript: protocols
    const safeUrl = url.trim().toLowerCase().startsWith('javascript:') ? '#' : url;

    // 2. Escape both variables so they can safely sit inside an HTML string
    const escapedUrl = escapeHtml(safeUrl);
    const escapedTxt = escapeHtml(txt);

    // 3. Return the raw HTML string with conditional target attributes
    if (config.blankTargets === 'yes') {
        return '<a href="' + escapedUrl + '" target="_blank" rel="noopener noreferrer">' + escapedTxt + '</a>';
    } else {
        return '<a href="' + escapedUrl + '">' + escapedTxt + '</a>';
    }
}
          
function checkAndLoadMgddScript( config ) {
  return new Promise((resolve) => {
             
    if( config.showMGDD === 'no' ) {
        console.log("Weather metrics skipped for this view profile.");
        return resolve(); // Exit safely without loading anything
    }

    console.log("Injecting weather script asset into layout head metadata...");

    const dynamicScript = document.createElement('script');
    dynamicScript.src = '../core/js/mgdd_helper.js';
    dynamicScript.type = 'text/javascript';

    dynamicScript.onload = async () => {
      console.log("Script compilation complete. Launching memory cache mapping arrays...");
      // Runs the initializer built inside mgdd_helper.js file
      await initializeMgddHelper();
      resolve(); // Resolution unlocks the 'await' pause in gatherResources
    };

    document.head.appendChild(dynamicScript);
  });
}

function isMultipleOfFour(num) {
  return num % 4 === 0;
}

//Checks if a specific Field ID has an active filter value in the current query string.
const hasActiveFilter = (queryString, fieldId) => {
  const params = new URLSearchParams(queryString);
  const ids = params.getAll('fieldid');
  const values = params.getAll('fieldvalue');
  const idx = ids.indexOf(fieldId.toString());
  return idx !== -1 && values[idx] !== '';
}

const getUrlWithoutFilter = (queryString, targetFieldId) => {
  const params = new URLSearchParams(queryString);
  const ids = params.getAll('fieldid');
  const names = params.getAll('fieldname');
  const values = params.getAll('fieldvalue');
  
  // 1. Group the URL parameters into clean individual tracking objects
  const fields = ids.map((id, index) => ({
    id: id.toString(),
    name: names[index] || '',
    value: values[index] || ''
  }));
  
  // 2. Filter out the specific column ID we want to remove
  const remaining = fields.filter(f => f.id !== targetFieldId.toString());
  
  // 3. Clear out the old keys entirely
  params.delete('fieldid');
  params.delete('fieldname');
  params.delete('fieldvalue');
  
  // 4. Re-append ONLY the surviving filters with their correct matching values
  remaining.forEach(f => {
    params.append('fieldid', f.id);
    params.append('fieldname', f.name);
    params.append('fieldvalue', f.value);
  });
  
  params.set('page', '1');
  return params.toString();
};
    
function fresults( xobj, config ) {

       // Parse the current URL parameters to grab any active filter values

       const urlValues = urlParams.getAll('fieldvalue'); 
       const urlNames  = urlParams.getAll('fieldname'); 
    
       for( let f = 0; f < field_array.length; f++ ) { 
            const currentId = field_array[f].toString(); 
      
            // Find if this specific ID already has a value or name stored in the URL 
            const urlIndex = urlIds.indexOf(currentId);

            let activeName = '';

                activeValue = urlValues[urlIndex] || ''; 
                activeName = urlNames[urlIndex] || ''; 
            } 
      
            // Push the boxRow into the display array with its real URL state values 
            box_array.push(new boxRow(currentId, activeName, activeValue)); 
       } 
   }
  
   // store box_array into appState
   appState.activeFilters = box_array;

      let per_page = xobj.per_page;

      labels.push({ innerHTML: '<span class="filterable-header">Name' + resetTaxonLink + '</span>' });

      // life stages column...

         let matchedCopy = 'no';
         let values = [];
         let dataType = '';
         let dataType2 = '';
         let matchValue = '';
         let matchTaxonId = '';
         let taxon = '';
         
         if( rec.taxon ){
             tax_id = rec.taxon.id;
             tax_name = rec.taxon.name || '';
             pref_tax_name = rec.taxon.preferred_common_name || '';
           
             if( rec.taxon.default_photo ){
                 if( rec.taxon.default_photo.url ){
                     tax_photo = '<img class="icon" src="'+rec.taxon.default_photo.url+'" />';
                 }
             }
         }

         if( tax_id !== '' ){
             let urlState = appState;
             urlState = setTaxonId(urlState, tax_id);
             urlState = setPage(urlState, '1');     // set the page to 1 anytime they choose to filter.
             urlState = setTaxonName(urlState, pref_tax_name||tax_name);
             // Manually escape only the unsafe variables from the API
             const escapedPrefName = escapeHtml(pref_tax_name.toLowerCase());
             const escapedTaxName = escapeHtml(tax_name);

             // Assemble the structured HTML content safely
             const formattedText = '<span style="font-size:larger">' + escapedPrefName + '</span>' +
                                   '<br><span style="font-style:italic">(' + escapedTaxName + ')</span>';

             // Pass a modified, unescaped version of furl2 that ONLY escapes the URL
             taxon = '<a href="' + escapeHtml('./field_study.html' + buildParameterList(urlState)) + '">' + formattedText + '</a>';
         }
       
         values = [{innerText:i+1}];

         values.push({innerHTML:tax_photo});
         values.push({innerHTML:taxon});

         if( p_show_ls === 'yes' ) { 
             let stage = ''; // Default placeholder if missing or empty 
             let valueId = ''; 
    
             if( rec.annotations && rec.annotations.length > 0 ) { 
                 for( let i = 0; i < rec.annotations.length; i++ ) { 
                      if( rec.annotations[i].controlled_attribute_id?.toString() === '1' ) { 
                          valueId = rec.annotations[i].controlled_value_id?.toString() || ''; 
                          // look up the life stage in the life stages map... 
                          stage = LIFE_STAGE_MAP[valueId] || 'unknown'; 
                          break; 
                      } 
                 }  
             } 
    
             if( stage === 'unknown' ) { 
                 values.push({ innerHTML: stage }); 
             } else { 
                 let urlState = appState; 
                 urlState = setPage(urlState, '1'); // set the page to 1 anytime they choose to filter. 
        
                 urlState = setLifeStage(urlState, valueId || 'null');     
                 values.push({ innerHTML: furl2('./field_study.html' + buildParameterList(urlState), stage || '[none]') }); 
             } 
         } 

         if( p_show_sex === 'yes' ) { 
             let sx = ''; // Default placeholder if missing or empty 
             let valueId = ''; 
    
             if( rec.annotations && rec.annotations.length > 0 ) { 
                 for( let i = 0; i < rec.annotations.length; i++ ) { 
                      if( rec.annotations[i].controlled_attribute_id?.toString() === '9' ) { 
                          valueId = rec.annotations[i].controlled_value_id?.toString() || ''; 
                          // look up the sex in the life stages map... 
                          sx = SEX_MAP[valueId] || 'unknown'; 
                          break; 
                      } 
                 }  
             } 
    
             if( sx === 'unknown' ) { 
                 values.push({ innerHTML: sx }); 
             } else { 
                 let urlState = appState; 
                 urlState = setPage(urlState, '1'); // set the page to 1 anytime they choose to filter. 
        
                 urlState = setSex(urlState, valueId || 'null');     
                 values.push({ innerHTML: furl2('./field_study.html' + buildParameterList(urlState), sx || '[none]') }); 
             } 
         } 

         // use a clickable scrollable div containing field notes in place of image when there is no image.
         if( rec.photos && rec.photos.length > 0 ) {
             const targetAttr = config.blankTargets === 'yes' ? ' target="_blank" rel="noopener noreferrer"' : '';
             const safeUrl = escapeHtml(root_observations + rec.id);
    
             values.push({ innerHTML: '<a href="' + safeUrl + '"' + targetAttr + '><img class="mini_photo2" src="' + escapeHtml(rec.photos[0].url) + '" /></a>' });
         } else {
             const displayNotes  = rec.description ? escapeHtml(rec.description) : '<i style="opacity: 0.6;">No notes</i>';
             const clickableLink = furl_out(config, root_observations + rec.id, rec.description ? 'View Details' : 'No notes');

             values.push({ 
                innerHTML: '<div style="max-width: 150px; max-height: 45px; overflow-y: auto; padding: 6px; scrollbar-width: thin; white-space: normal; ' + 
                   'background-color: var(--color-alt); ' + 
                   'color: var(--color-text); ' + 
                   'border: 1px solid var(--color-border); ' + 
                   'border-radius: 4px; font-size: 0.9em; line-height: 1.4;">' + 
                   displayNotes + '<br>' + clickableLink +
                   '</div>'
             });         
         }

         if( config.showMGDD === 'yes' ) {
             // Safely extract variables with fallbacks to prevent crashes
             var mgddValue = getMgddForObservationId(rec.id); 
             var lonVal    = rec.geojson?.coordinates?.slice(0, 1).join('') ?? ''; 
             var latVal    = rec.geojson?.coordinates?.slice(1, 2).join('') ?? ''; 
             var dateVal   = rec.observed_on_details?.date ?? ''; 

             const activeDateStr = rec.observed_on_details?.date; // Expects "YYYY-MM-DD"
             let displayDates = 'No Date'; 

             if( activeDateStr && activeDateStr.length === 10 ) {
                 const year = activeDateStr.slice(0, 4);
                 const month = activeDateStr.slice(5, 7);
                 const day = activeDateStr.slice(8, 10);
                 // Combine them directly into "02-01-YYYY to MM-DD-YYYY"
                 displayDates = '02-01-' + year + ' to ' + month + '-' + day + '-' + year;
             }

             // FORCE string conversion using String() so escapeHtml never runs into a non-string type
             const safeLat = escapeHtml(String(latVal));
             const safeLon = escapeHtml(String(lonVal));
             const safeDate = escapeHtml(String(dateVal));
             const safeMgdd = escapeHtml(String(mgddValue));
             const safeDisplayDates = escapeHtml(String(displayDates));

             // Output the raw HTML structure directly
             values.push({ 
               innerHTML: '<a href="#" class="clickable-breakdown-action" style="text-decoration: none; color: var(--color-text-link);" ' +
                  'onclick="showMgddBreakdownModal(\'' + safeLat + '\', \'' + safeLon + '\', \'' + safeDate + '\'); return false;">' +
                  '<span style="display: inline-block; line-height: 1.4;">' + 
                  safeMgdd + '<br>' +
                  '<span style="font-size: 0.85em; font-style: italic;">(' + safeDisplayDates + ')</span>' +
                  '</span>' +
                  '</a>' 
             });
         }

         if( config.showMonth === 'yes' ) { 
             let month = ''; // Default placeholder if missing or empty 
             let valueId = ''; 
    
             if( rec.observed_on_details.month ) { 
                 valueId = rec.observed_on_details.month || '';
                 const months = [ "January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December" ];
                 // For 1-indexed month (1 = January, so index is month - 1)
                 month = months[valueId-1] || 'unknown'; 
             } 
    
             if( month === 'unknown' ) { 
                 values.push({ innerHTML: month }); 
             } else { 
                 let urlState = appState; 
                 urlState = setPage(urlState, '1'); // set the page to 1 anytime they choose to filter. 
        
                 urlState = setMonth(urlState, valueId || 'null');     
                 values.push({ innerHTML: furl2('./field_study.html' + buildParameterList(urlState), month || '[none]') }); 
             } 
         } 
       
         let user_icon = rec.user.icon || '';
         
         if( user_icon === '' ){
            user_icon += '<span class="user"><span class="npcicon"></span>';
         } else {
            user_icon = '<img class="smallicon" src="'+user_icon+'" />';
         }

         let emojiTitle = 'Merged Observation Fields:&#10;';

         if( rec.ofvs && rec.ofvs.length > 0) {
             for( let r = 0; r < box_array.length; r++ ) { 
                  const box = box_array[r]; 
                  const targetBoxFieldName = box.field_name?.toLowerCase(); 
                  const targetBoxFieldIdStr = box.field_id.toString(); 
  
                  for( let j = 0; j < rec.ofvs.length; j++ ) { 
                       const ofv = rec.ofvs[j]; 
                       const ofvFieldIdStr = ofv.field_id.toString(); 
                       const ofvValue = ofv.value ?? ''; 
                       const ofvValueLower = ofvValue.toString().toLowerCase(); 
    
                       // Mismatch & Validation Checking --- 
                       if( field_array.includes(ofvFieldIdStr) ) { 
                           if( matchValue === '' ) { 
                               matchValue = ofvValue; 
                           } else if (ofvValue !== '' && matchValue !== ofvValue) { 
                               mismatch = 'yes'; 
                           } 
                           if( dataType === '') { 
                               dataType = ofv.datatype; 
                           } else if (dataType !== ofv.datatype) { 
                               mismatch = 'yes'; 
                           } 
                           if( ofv.taxon ) { 
                               if( matchTaxonId === '' ) { 
                                   matchTaxonId = ofv.taxon.id; 
                               } 
                               if( ofv.taxon.id !== matchTaxonId ) { 
                                   mismatch = 'yes'; 
                               } 
                           }  
                       } 
    
                       // Cache taxon names for readability below 
                       const taxonName = ofv.taxon?.name || ''; 
                       const commonName = ofv.taxon?.preferred_common_name || ''; 
    
                       // Merge Mode --- 
                       if( config.merge === 'yes' && ofvFieldIdStr === targetBoxFieldIdStr ) { 
                           field1 = ofvValueLower; 
                           if( ofv.taxon ) { 
                               const iconicIdStr = ofv.taxon.iconic_taxon_id?.toString(); 
                               if( !config.ofield_iconic || config.ofield_iconic === iconicIdStr ) { 
                                   field1 = taxonName; 
                                   displayCommonName = commonName.toLowerCase(); 
                                   displayTaxonName = taxonName; 
                                   // Manually escape only the unsafe variables from the API
                                   const escapedPrefName = escapeHtml(displayCommonName);
                                   const escapedTaxName = escapeHtml(displayTaxonName);

                                   const formattedText = '<span style="font-size:larger">' + escapedPrefName + '</span>' +
                                                         '<br><span style="font-style:italic">(' + escapedTaxName + ')</span>';

                                   // Pass a modified, unescaped version of furl2 that ONLY escapes the URL
                                   displayName = '<a href="' + escapeHtml('./field_study.html' + buildParameterList(appState)) + '">' + formattedText + '</a>';
                                   emojiTitle += `${ofv.field_id} ${taxonName}\n`;
                               } else { 
                                   emojiTitle += `${ofv.field_id} ${taxonName.toLowerCase()}\n`; 
                                   displayName = ''; 
                               } 
                           } else { 
                               if( ofvValueLower !== 'unknown' ) { 
                                   displayName = ofvValueLower; 
                               } 
                               emojiTitle += `${ofv.field_id} ${ofvValueLower}\n`; 
                           }  
                       } 
    
                       // --- SECTION C: No-Merge Mode --- 
                       if( config.merge !== 'yes' && ofvFieldIdStr === targetBoxFieldIdStr ) { 
                           matchedCopy = 'yes'; 
                           if( ofv.value ) { 
                               // Start by escaping the raw text value from the API
                               field1 = escapeHtml(ofvValueLower); 
                               displayName = ofvValueLower; 

                               let hasHtmlLayout = false;

                               if( ofv.taxon ) { 
                                   // Escape both API text strings safely
                                   const escapedCommon = escapeHtml(commonName.toLowerCase());
                                   const escapedTaxon = escapeHtml(taxonName);
            
                                   //  Wrap them in hardcoded HTML formatting
                                   field1 = `<span style="font-size:larger">${escapedCommon}</span><span style="font-style:italic"><br>(${escapedTaxon})</span>`; 
                                   hasHtmlLayout = true;
                               } 

                               // Wild ancestral colony 
                               if( ofvFieldIdStr === '17383' ) { 
                                   // Create a clean link using the ID or raw value, NOT the HTML spans.
                                   // Since field1 contains HTML spans, we bypass furl2 so the browser renders the styling.
                                   const targetUrl = root_observations + encodeURIComponent(ofvValue.toString());
                                   values.push({ innerHTML: '<a href="' + escapeHtml(targetUrl) + '">' + field1 + '</a>' }); 
                               } else { 
                                   const cleanValue = replaceDoubleQuotes(ofvValue.toString()); 
            
                                   // Let the store utility generate your clean lowercase array parameter string safely 
                                   let updatedParamsStr = updateUrlParamsByFieldId(window.location.search, ofvFieldIdStr, ofv.name, cleanValue, config); 
                                   const isPrimaryField = config.fieldName && (ofv.name?.toLowerCase() === config.fieldName.toLowerCase()); 
                                   const finalParams = new URLSearchParams(updatedParamsStr); 
                                   finalParams.set('page', '1'); 
            
                                   if( isPrimaryField ) { 
                                       finalParams.set('plantname', commonName || taxonName); 
                                   } 

                                   // If field1 contains rich HTML layouts, don't pass it to furl2. Assemble it directly.
                                   const destinationUrl = './field_study.html?' + finalParams.toString();
                                   let url;
                                   if( hasHtmlLayout ) {
                                       url = '<a href="' + escapeHtml(destinationUrl) + '">' + field1 + '</a>';
                                   } else {
                                       url = furl2(destinationUrl, field1);
                                   }

                                   if( isPrimaryField && config.fieldOutlink ) { 
                                       // This hardcoded icon string is safe to pass with your 'true' flag if you updated furl2,
                                       // or just concatenate it manually here.
                                       let outlink = '<a href="' + escapeHtml(config.fieldOutlink + ofvValue.toString()) + '">' +
                                                     '<span style="font-size: 1.3rem; padding-right: 10px; display: inline-block; vertical-align: middle; margin-bottom: -0.3rem;">🛈</span>' +
                                                      '</a>';
                
                                       values.push({ innerHTML: '<span class="filterable-header">' + outlink + '</span>' + url }); 
                                   } else { 
                                       values.push({ innerHTML: url }); 
                                   } 
                               } 
                           } else { 
                             values.push({ innerText: '' }); 
                           } 
                       } // end c
                  } // End of j loop 
  
                  if( config.merge !== 'yes' ) { 
                      if( matchedCopy === 'yes' ) { 
                          matchedCopy = 'no'; 
                      } else { 
                          values.push({ innerText: '' }); 
                      } 
                  } 
             } // End of r loop
         }
        
         if( config.merge === 'yes' ){
             if( displayTaxonName !== '' ){ 
                 // Escape the API text strings immediately
                 const escapedCommon = escapeHtml(displayCommonName.toLowerCase());
                 const escapedTaxon = escapeHtml(displayTaxonName);
                 const escapedEmojiTitle = escapeHtml(emojiTitle);

                 if( mismatch === 'yes' ){ 
                     document.getElementById("mismatch").style.display = "inline"; 
            
                     // Assemble using the clean, escaped variables
                     displayName = '<span style="font-size:larger">'+escapedCommon+'</span>' +
                                   '<span style="font-style:italic"><br>('+escapedTaxon+') ' +
                                   '<span class="flowericon" title="' + escapedEmojiTitle + '">&#x1F338;</span></span>'; 
                 } else { 
                     displayName = '<span style="font-size:larger">'+escapedCommon+'</span>' +
                                   '<span style="font-style:italic"><br>('+escapedTaxon+')</span>'; 
                 } 
             } else { 
                 if( mismatch === 'yes' ){ 
                     document.getElementById("mismatch").style.display = "inline"; 
            
                     // Escape the emoji title text variable here too
                     const escapedEmojiTitle = escapeHtml(emojiTitle);
            
                     displayName += ' '; 
                     displayName += '<span class="flowericon" title="' + escapedEmojiTitle + '">&#x1F338;</span></span>'; 
                 } 
             } 
             values.push({innerHTML:displayName}); 
         }          

         if( getComponent(appState) === COMPONENT_VISITS || p_show_notes === 'yes' ) {
             let urlState = appState;
             urlState = setObsDate(urlState, rec.observed_on_details?.date ?? null);
             urlState = setPage(urlState, '1'); // set the page to 1 anytime they choose to filter.

             if( getComponent(appState) === COMPONENT_VISITS ) {
                 values.push({innerHTML: furl2('./field_study.html'+buildParameterList(urlState),rec.observed_on_details?.date ?? null) });
             }

             const relatedObs = rec.ofvs.find(item => item.field_id === 948)?.value;

             let relatedObsUrl = relatedObs 
                 ? '<br>Related Observation: ' + furl2(root_observations + relatedObs, relatedObs) 
                 : '';

             const rawDescription = rec.description || 'No description';
             const fullText = escapeHtml(rawDescription);

             // The cell preview template can safely render the raw HTML link
             const displayHtml = rec.description 
                 ? escapeHtml(rec.description) + relatedObsUrl 
                 : '<i style="opacity: 0.6;">No description</i>' + relatedObsUrl;

             values.push({
                 innerHTML: '<div class="clickable-note-cell" ' +
                            'style="max-width: 300px; max-height: 45px; overflow-y: auto; padding: 6px; scrollbar-width: thin; white-space: normal; ' +
                            'background-color: var(--color-alt); color: var(--color-text); border: 1px solid var(--color-border); ' +
                            'border-radius: 4px; font-size: 0.9em; line-height: 1.4; cursor: pointer;" ' +
                            'onclick="openNoteModal(this)" ' +
                            'data-full-note="' + fullText + '" ' +
                            'data-related-url="' + escapeHtml(relatedObsUrl) + '">' + // Passed safely escaped
                            displayHtml + 
                 '</div>'
             });
         }
                
         let urlState = appState;
         urlState = setUser(urlState, rec.user.login);
         urlState = setPage(urlState, '1');     // set the page to 1 anytime they choose to filter.

         values.push({innerHTML:'<span class="user">'+user_icon+furl2('./field_study.html'+buildParameterList(urlState),rec.user.login)+'</span>'});
         
         tempBrow.push(values);
      };

      let table = faddelem('table',document.body,{id:'main'});
      let thead = faddelem('thead',table);
      let hrow = faddelem('tr',thead);

      //labels.push({innerText:'User Photo'});
      if( getComponent(appState) === COMPONENT_VISITS || p_show_notes === 'yes' ) {
          if( getComponent(appState) ===  COMPONENT_VISITS ) { labels.push({innerText:'Date'}); }
          labels.push({innerText:'Field Notes'});
      }

      // Observer column...
      let obsState = appState; 
      obsState = setUser(obsState, '');
      obsState = setPage(obsState, '1'); 
      let obsUrl = './field_study.html' + buildParameterList(obsState); 

      // Is a valid, active observer filter currently in the URL string? 
      let hasObsFilter = window.location.search.includes('user=') && 
                        !window.location.search.includes('user=&'); 

      let resetObsLink = hasObsFilter ? ' ' + furl2(obsUrl, iconHtml) : '';

      labels.push({ innerHTML: '<span class="filterable-header"><span class="user_head">Observer' + resetObsLink + '</span></span>' });

      faddelems('th',hrow,labels);

      let tbody = faddelem('tbody',table);
    
      // loop through array of rows stored on object.
      for( let q=0; q<tempBrow.length; q++ ){
           let brow = faddelem('tr',tbody);
           faddelems('td',brow,tempBrow[q]);
      }

      if( config.pagingEnabled ) {
          // buttons to go to prev or next page
          let nav = faddelem('div',document.body,{id:'nav'});
          (page_curr<=1)?faddelem('span',nav,{classList:'button_inactive',title:'already on first page',innerHTML:'&laquo'}):faddelem('a',nav,{classList:'button',title:'first page',id:'button_first',innerHTML:'&laquo',href:fpageurl(winurlexsearchstr,winurlparams,per_page,1)});
          (page_prev===null)?faddelem('span',nav,{classList:'button_inactive',title:'no previous page',innerHTML:'&#8249'}):faddelem('a',nav,{classList:'button',title:'previous page',id:'button_prev',innerHTML:'&#8249',href:fpageurl(winurlexsearchstr,winurlparams,per_page,page_prev)});
          (page_next===null)?faddelem('span',nav,{classList:'button_inactive',title:'no next page',innerHTML:'&#8250'}):faddelem('a',nav,{classList:'button',title:'next page',id:'button_next',innerHTML:'&#8250',href:fpageurl(winurlexsearchstr,winurlparams,per_page,page_next)});
          (page_curr>=page_max)?faddelem('span',nav,{classList:'button_inactive',title:'already on last page',innerHTML:'&raquo'}):faddelem('a',nav,{classList:'button',title:'last page',id:'button_last',innerHTML:'&raquo',href:fpageurl(winurlexsearchstr,winurlparams,per_page,page_max)});
      } else {
          let nav = faddelem('div', document.body, { classList: 'inat-floating-nav' }); 
          let url = root_observations + api_params; 
          faddelem('a', nav, { title: 'entire dataset', classList: 'button inat-wide-button', innerText: 'View more on iNaturalist', href: url, target: '_blank', rel: 'noopener noreferrer' });
      }
   }
   else { faddelem('p',document.body,{innerText:'No results returned.'}); }; 
};

</script>

<script type="text/javascript"   src="../core/js/ConfigManager.js"></script>
<script type="text/javascript"   src="../core/js/api_fetch.js"></script>
 
<script>
function setupAPIParams( config ) {

   if( config.obsExclusionParams ) {
       // Strips any combination of leading '?' or '&' from the start of the string
       const cleanExclusions = config.obsExclusionParams.replace(/^[?&]+/, '');
       api_params += '?' + cleanExclusions;
       api_params += '&project_id=' + config.project;
   } else {
       api_params += '?project_id='+config.project;
   }

   // --- Consolidated iNat Multi-Field API Builder ---
   const initialParams = new URLSearchParams(window.location.search);
   const initialNames = initialParams.getAll('fieldname');
   const initialValues = initialParams.getAll('fieldvalue');

   const lowerCaseNames = initialNames.map(name => name.toLowerCase());

   // Core Rule: If the URL has no active filters (First Entrance), use your config defaults
   if( config.fieldName && !lowerCaseNames.includes(config.fieldName.toLowerCase() ) ) {
       api_params += '&field:' + config.fieldName;
       if( config.fieldValue ) {
           api_params += '=' + encodeURIComponent(config.fieldValue);
       }
   }

   // 2. Sequential Loop: Process whatever filters are explicitly remaining in the URL bar
   initialNames.forEach((name, index) => {
     const value = initialValues[index];
     if( name && value ) {
         api_params += '&field:' + name + '=' + encodeURIComponent(value);
     }
   });
  
   if( getObsDate(appState)    ) { api_params += '&on='       + getObsDate(appState); }

   if( getUser(appState) ) {
       api_params += '&user_id=' + getUser(appState);
   } else if( config.userId ) { 
       api_params += '&user_id='  + config.userId; 
   }

   if( getPlaceMenuId(appState) ) {
       api_params += getPlaceMenuIdParam(appState, '&place_id=');
   } else {
       if( config.defaultPlace ) { 
           api_params += '&place_id='        + config.defaultPlace; 
       } else {
           api_params += '&place_id=any';
       }
   }

   // if a taxon_id was chosen from a row in the table, use that taxon_id.  if not, 
   // use the menu_id if one was passed in.
   if( getTaxonId(appState) ) {
       api_params += '&taxon_id='+getTaxonId(appState);
   } else if( getMenuId(appState) ) { 
       api_params += '&taxon_id=' + getMenuId(appState); 
   } else {
       if( config.defaultTaxonId ) {
           api_params += '&taxon_id=' + config.defaultTaxonId;
       }
   }

   // if a filter has been chosen, get the filter api params
   if( getActivityFilter(appState) ) {
       api_params += getFilterAPIParams(config);
   }

   // filter for month...
   if( getMonth(appState) ) {
       if( getMonth(appState) !== 'null' ) {
           api_params += '&month=' + getMonth(appState);
       }
   } else if( config.defaultMonths ) {
           api_params += '&month=' + config.defaultMonths;
   }

   // filter for life stage annotation...
   if( getLifeStage(appState) ) { 
       if( getLifeStage(appState) === 'null' ) {
           api_params += '&without_term_id=1';
       } else {
           api_params += '&term_id=1&term_value_id='  + getLifeStage(appState);
       }
   }

   // filter for sex annotation...
   if( getSex(appState) ) {
       if( getSex(appState) === 'null' ) {
           api_params += '&without_term_id=9';
       } else {
           api_params += '&term_id=9&term_value_id=' + getSex(appState);
       }
   }

   // filter for evidence annotation...
   if( getEvidence(appState) ) { 
       if( getEvidence(appState) === 'null' ) {
           api_params += '&without_term_id=22';
       } else {
           api_params += '&term_id=1&term_value_id='  + getEvidence(appState);
       }
   }
 
   if( p_without_term_id )   { api_params += '&without_term_id=' + p_without_term_id; }
   if( p_not_user_id )       { api_params += '&not_user_id='     + p_not_user_id; }

   if( config.obsAPIParams ) { api_params += config.obsAPIParams; }

   // default all of these so they stay consistent across inat identify page, inat explore page, and the table.
   // may need to revisit if/when the table sorts by quality_grade.
   api_params += '&reviewed=any&quality_grade=needs_id,research,casual&verifiable=any';

   // set the params for the identify link to the exact filtration parameters
   // to be used in the api transaction that will populate the table with whatever 
   // filtrations were selected.
   if( config.identifyEnabled === 'yes' ) {
       identify_params = api_params;
   } 
          
   api_params += getPageParam(appState, '&page=');
   api_params += '&per_page='+CONST_OBSERVATIONS_PER_PAGE;

   // This prevents the application loop from inadvertently double-encoding quotes (%2522)
   // This would break if there is ever a % symbol stored in a field value...may need to revisit
   api_params = api_params.replace(/%2522/g, '%22').replace(/%252F/g, '%2F'); 
 
   return api_params;
}
   
async function gatherResources() {
  let api_base  = 'https://api.inaturalist.org/v1/observations';
  let json_path = json_root + getParams(appState);
 
  try {
   
      // Await the result of getObservations() and store the actual data
      const config  = await asyncGetConfiguration( json_path, getComponent(appState), getStudyTitle(appState) );
      console.log('full config title: ' + config.getFullTitle());          
      const api_params    = setupAPIParams( config );
      const api_url       = api_base+api_params;
      console.log('api url: ' + api_url);
      const obs_data      = await apiFetch( api_url ); 

      if( config.showMGDD === 'yes' ) { 
          await checkAndLoadMgddScript( config );   
      }
     
      // Pass the data to the buildPage function
      fresults(obs_data, config); 

    } catch (error) {
      console.error("An error occurred:", error);
      faddelem('p',document.body,{innerHTML:('<span id="error">&#9888;<br>' + error.message + '</span>')}); 
      throw error;
    }
}

let message = validateConfig(appState);
 
if( message ) {
    faddelem('p',document.body,{innerHTML:('<span id="error">&#9888;<br>' + message + '</span>')}); 
} else {
    gatherResources(); 
}
  
</script>
