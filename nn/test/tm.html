<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic iNaturalist Observations Map</title>
    
    <!-- Leaflet Map CSS & JavaScript Assets -->
    <link rel="stylesheet" href="https://unpkg.com" />
    <script src="https://unpkg.com"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            font-family: sans-serif;
        }
        #map {
            height: 100%;
            width: 100%;
        }
        .loading-shield {
            position: absolute;
            top: 15px;
            left: 60px;
            background: rgba(255, 255, 255, 0.9);
            padding: 8px 15px;
            border-radius: 4px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            z-index: 1000;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="loading" class="loading-shield">Fetching observations...</div>
    <div id="map"></div>

    <script>
// Wrap everything in an onload function to wait until Leaflet is ready
window.onload = function() {
    const urlParams = new URLSearchParams(window.location.search);
    
    // Error handling helper
    const setStatus = (msg) => {
        document.getElementById('loading').innerHTML = msg;
    };

    // Check if user completely forgot parameters
    if ([...urlParams.keys()].length === 0) {
        setStatus("⚠️ Missing filters! Add '?project_id=157918' to the end of your browser address bar.");
        return; // Stop running
    }

    const defaultLat = parseFloat(urlParams.get('centerlat')) || 39.1337;
    const defaultLng = parseFloat(urlParams.get('centerlng')) || -84.3525;
    const defaultZoom = parseInt(urlParams.get('defaultzoom')) || 12;

    // L will now definitely be defined here because the page has fully loaded
    const map = L.map('map').setView([defaultLat, defaultLng], defaultZoom);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    if (!urlParams.has('per_page')) urlParams.set('per_page', '200');
    
    const iNatApiUrl = `https://inaturalist.org{urlParams.toString()}`;

    fetch(iNatApiUrl)
        .then(response => {
            if (!response.ok) throw new Error(`iNaturalist API Server Error (Status ${response.status})`);
            return response.json();
        })
        .then(data => {
            const observations = data.results || [];
            const markerGroup = L.featureGroup();

            if (observations.length === 0) {
                setStatus("❌ No observations found matching these filters.");
                return;
            }

            let validPinsCount = 0;

            observations.forEach(obs => {
                if (obs.location) {
                    const [lat, lng] = obs.location.split(',').map(Number);
                    const speciesName = obs.taxon ? obs.taxon.preferred_common_name || obs.taxon.name : 'Unknown Organism';
                    const obsUser = obs.user ? obs.user.login : 'Anonymous';
                    const thumbUrl = obs.observation_photos?.[0]?.photo?.url || '';
                    
                    let popupText = `<strong>${speciesName}</strong><br>By: ${obsUser}<br>`;
                    if (thumbUrl) popupText += `<img src="${thumbUrl}" style="width:100px;margin-top:5px;border-radius:4px;"><br>`;
                    popupText += `<a href="${obs.uri}" target="_blank">View Entry</a>`;

                    const marker = L.marker([lat, lng]).bindPopup(popupText);
                    markerGroup.addLayer(marker);
                    validPinsCount++;
                }
            });

            if (validPinsCount === 0) {
                setStatus("⚠️ Found items, but none contain public map coordinates.");
                return;
            }

            markerGroup.addTo(map);
            document.getElementById('loading').style.display = 'none';

            if (!urlParams.has('centerlat') || !urlParams.has('centerlng')) {
                map.fitBounds(markerGroup.getBounds(), { padding: [50, 50] });
            }
        })
        .catch(error => {
            console.error(error);
            setStatus(`🛑 Connection Error: ${error.message}`);
        });
};
    </script>
</body>
</html>
