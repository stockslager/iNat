<!DOCTYPE html>
<html lang="en">
<head> 
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />

  <link rel="icon" type="image/png" href="../core/assets/plant-icon-96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="../core/assets/plant-icon-96.svg" />

  <script type="text/javascript" src="../core/js/ConfigManager.js"></script>
  
  <script>
    let config   = null; 

    function buildMenu( config ) {
       // Create the main navbar container
       let navbar = document.createElement('div');
       navbar.className = 'navbar v2-menu';
  
       // Build the Home Link
       let homeUrl = '../studies/field_study.html';
       buildNavHome( navbar, homeUrl, appState, config );
  
       let appContainer = document.getElementById('app');
       if( appContainer ) {
           appContainer.insertBefore(navbar, appContainer.firstChild);
       } else {
           document.body.insertBefore(navbar, document.body.firstChild);
       }
    }
    
    async function gatherResources() {
      let json_path = json_root + getParams(appState);
      try {
        config = await asyncGetConfiguration( json_path, getComponent(appState), getStudyTitle(appState) );
        buildMenu(config);    
      } catch (error) {
        console.error("An error occurred:", error);
        faddelem('p',document.body,{innerHTML:('<span id="error">⚠<br>' + error.message + '</span>')});
        throw error;
      }
    }

  </script>
  
  <title>Observations Map</title>

  <!-- Leaflet Map CSS & JavaScript Assets -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    /* ==========================================================================
       YOUR INJECTED CUSTOM APPLICATION STYLES
       ========================================================================== */
    html { 
      background-color: #0f172a; 
      box-sizing: border-box; 
      min-height: 100vh; 
      padding: 10px 50px 24px 50px; /* Top, Right, Bottom, Left */ 
    } 
    body { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
      background-color: transparent; 
    } 
    #app { 
      background-color: #000000; 
      border: 2px solid #333; 
      border-radius: 5px; 
      padding: 0px; 
      box-sizing: border-box; 
      width: 100%; 
      max-width: 100%; 
      margin-top: 10px; 
      min-height: calc(100vh - 72px);
      position: relative; /* FIX: Prevents elements from breaking absolute mapping boundaries */
      overflow: hidden;   /* FIX: Keeps rounded corners clean around child elements */
      
      display: flex;
      flex-direction: column;
    } 
    .widget-component-container { 
      width: 100%; 
      max-width: 100%; 
      margin: 0; 
      box-sizing: border-box; 
    } 
    /* ========================================================================== NATIVE LAYOUT FLOW ELEMENTS ========================================================================== */ 
    #main, .top-bar, #divhead { 
      width: 100%; 
      max-width: 100%; 
      margin-left: 0; 
      margin-right: 0; 
      box-sizing: border-box; 
    } 
    .top-bar { 
      display: flex; 
      justify-content: space-between; 
      align-items: stretch; 
      gap: 10px; 
      margin-bottom: 10px; 
    } 
    /* 4. THE BOXES: Fixed horizontal scroll and standard styling */ 
    #stats, #dltest { 
      display: block; 
      box-sizing: border-box; 
      max-height: 64px; 
      overflow-y: auto; 
      overflow-x: hidden; 
      width: fit-content; 
      white-space: nowrap; 
      border: 2px solid var(--color-border); 
      border-radius: 5px; 
      padding: 3px 8px; 
      background: var(--color-base); 
      line-height: 1.2; 
      color: var(--color-text); 
      font: 14px Sans-Serif; 
    } 
    /* 5. THE SHIELD: Reset internal table tags and remove ALL default underlines */ 
    #stats table, #stats td, #stats tr, #dltest table, #dltest td, #dltest tr { 
      border: none; 
      background: transparent; 
      padding: 0 12px 0 0; /* Extra 12px padding to the right for breathing room */ 
      box-shadow: none; 
      color: inherit; 
      font: inherit; 
      text-decoration: none; /* KILLS ALL UNDERLINES IN ALL ROWS */ 
      margin: 0; 
      border-collapse: collapse; 
    } 
    /* KILL UNDERLINES FOR ALL LINKS IN THE BOXES */ 
    #stats a, #dltest a { 
      color: var(--color-text-link); 
      text-decoration: none; 
    } 
    #dltest tr:first-child td { 
      text-decoration: underline; 
    } 
    /* 6. NAVBAR */ 
    .navbar { 
      background-color: var(--color-brand); 
      border-radius: 5px; 
      font-family: Arial, Helvetica, sans-serif; 
      display: flex; 
      align-items: center; 
      min-height: 40px; 
      overflow: hidden; 
      
      flex-shrink: 0;
    } 
    .inat-floating-nav { 
      margin-left: -8px; 
      position: -webkit-sticky; /* Safari */ 
      position: sticky; 
      left: 0; 
      bottom: 0; 
      background: var(--color-base-translucent); 
      width: 188px; 
      height: 52px; 
      border-radius: 14px; /* Alignment: Centers the outlined button neatly inside this container */ 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      box-sizing: border-box; 
    } 
    @media print { 
      .inat-floating-nav { 
        display: none; 
      } 
    } 
    .button.inat-wide-button { 
      /* Resets the narrow 32px bounds so the text fits */ 
      width: 168px; 
      height: 36px; 
      margin: 0; /* Inherits native styles */ 
      background: var(--color-alt); 
      border: 1px solid var(--color-border); 
      color: var(--color-text-link); /* Custom Typography */ 
      font-size: 13px; 
      line-height: 1.2; 
      border-radius: 8px; /* Displays and centers multi-line text blocks */ 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      text-align: center; 
      white-space: normal; 
      text-decoration: none; 
      box-sizing: border-box; /* Apply translucency */ 
      opacity: 0.7; 
      transition: opacity 0.2s ease, background 0.2s ease; 
    } 
    .button.inat-wide-button:hover { 
      opacity: 1.0; 
      background: var(--color-hover); 
    } 
    /* ========================================================================== WIDGET INHERITANCE AND COLOR THEMING OVERRIDES ========================================================================== */ 
    /* 1. Target theme container cleanly using nesting to drop padding/margin hacks */ 
    #app #themeContainer { 
      background-color: #000000; 
      padding: 0; 
      margin: 0; 
    } 
    /* 2. Target the widget wrappers using its exact composite chain to drop !important */ 
    #themeContainer .inat-widget, #themeContainer [data-inat-widget], #themeContainer div[data-inat-widget] { 
      border: none; 
      background: transparent; 
      box-shadow: none; 
      color: #ffffff; /* Sets the default white text variant */ 
    } 
    /* 3. Increase hyperlink specificity path so the sky blue overrides third-party files */ 
    #app #themeContainer [data-inat-widget] a, #themeContainer .inat-widget a { 
      color: #38bdf8; 
    } 
    /* Original Helpers */ 
    #h2 { 
      font-weight:bold; 
      font-size:20px; 
    } 
    p { 
      width:100%; 
    } 
    .npcicon { 
      width:14px; 
      height:14px; 
      border: 1px solid cornflowerblue; 
      padding: 5px; 
      border-radius: 50px; 
    } 
    .user_head { 
      align-items: center; 
      justify-content: center; 
    } 
    .user { 
      display: inline-flex; 
      align-items: center; 
      white-space: nowrap; 
      gap: 8px; 
      margin-left: 2px; 
    }

    /* ==========================================================================
       MAP SPECIFIC SUB-COMPONENTS
       ========================================================================== */
    #map {
      /* FIX: Explicit absolute positioning relative to #app to keep height perfectly fluid */
      width: 100%;
      height: 100%;
      position: relative;
      flex-grow: 1;
      width: 100%;    
    }

    .info-shield {
      position: absolute;
      top: 15px;
      left: 60px;
      background: rgba(15, 23, 42, 0.9); /* Styled dark to match your dashboard palette */
      color: #ffffff;
      padding: 8px 15px;
      border: 1px solid #333;
      border-radius: 4px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
      z-index: 1000;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 14px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  
    <div id="app">
        <div id="info" class="info-shield">Loading iNaturalist Map Layer...</div>
        <div id="map"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            // 1. Parse your state string from the URL
            let winurlsearchstr = window.location.search;
            let winurlparams = new URLSearchParams(winurlsearchstr);
            appState = buildStateFromParams(winurlparams);

            // 2. Run your configuration validation check
            let message = validateConfig(appState);
            if (message) {
                faddelem('p', document.body, { innerHTML: ('<span id="error">⚠️<br>' + message + '</span>') });
                return; // Stop execution if config is invalid
            }

            // 3. Build your menu components first
            await gatherResources();

            // 4. Initialize Map Setup Steps
            const urlParams = new URLSearchParams(window.location.search);
            if ([...urlParams.keys()].length === 0) {
                document.getElementById('info').innerHTML = "⚠️ Missing filters! Add '?project_id=157918' to your address bar.";
                return;
            }

            // Read positional coordinates out of the parameters
            const defaultLat = parseFloat(urlParams.get('centerlat')) || 39.1337;
            const defaultLng = parseFloat(urlParams.get('centerlng')) || -84.3525;
            const defaultZoom = parseInt(urlParams.get('defaultzoom')) || 12;

            // Initialize Leaflet Map Instance
            const map = L.map('map').setView([defaultLat, defaultLng], defaultZoom);

            // Map Base Tiles (OpenStreetMap)
            const osm1 = 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png';
            L.tileLayer(osm1, { maxZoom: 19, attribution: '&copy; OpenStreetMap' }).addTo(map);

            // Purge layout commands from the parameter stack so they do not error the iNat endpoint
            const iNatParams = new URLSearchParams(urlParams);
            iNatParams.delete('centerlat');
            iNatParams.delete('centerlng');
            iNatParams.delete('defaultzoom');

            // Custom Points Layer (iNaturalist API Engine)
            const tileHost1 = 'https://api.inaturalist.org/v1/points/{z}/{x}/{y}.png?';
            const iNatTileUrl = tileHost1 + iNatParams.toString();
            L.tileLayer(iNatTileUrl, { maxZoom: 20, opacity: 0.85, attribution: '&copy; iNaturalist Data Layer' }).addTo(map);

            // Cleanly remove loading notice panel when operations complete
            document.getElementById('info').style.display = 'none';
        });
    </script>
</body>

</html>
