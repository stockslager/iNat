<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabbed Iframe Application Terminal</title>
    
    <style>
        /* Global Background Reset Resetting to Dark Baseline */
        body {
            background-color: #0f172a;
            margin: 0;
            padding: 20px;
            transition: background-color 0.2s ease;
        }

        /* Master Container Layout Framework */
        .tab-component-container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            box-sizing: border-box;
            font-family: sans-serif;
            transition: background-color 0.2s ease;
        }

        /* --- DARK THEME STYLING CONFIGURATION --- */
        .tab-component-container.dark-theme {
            background-color: #0f172a;
        }
        .dark-theme .tab-header-track {
            border-bottom: 1px solid #334155;
        }
        .dark-theme .custom-tab-header {
            background-color: #0f172a;
            color: #94a3b8;
            border: 1px solid #334155;
            border-bottom: none;
        }
        .dark-theme .custom-tab-header.active-tab {
            background-color: #1e293b;
            color: #38bdf8;
        }
        .dark-theme .custom-tab-content {
            border: 1px solid #334155;
            background-color: #1e293b;
        }

        /* --- LIGHT THEME STYLING CONFIGURATION --- */
        .tab-component-container.light-theme {
            background-color: #f8fafc;
        }
        .light-theme .tab-header-track {
            border-bottom: 1px solid #cbd5e1;
        }
        .light-theme .custom-tab-header {
            background-color: #e2e8f0;
            color: #64748b;
            border: 1px solid #cbd5e1;
            border-bottom: none;
        }
        .light-theme .custom-tab-header.active-tab {
            background-color: #ffffff;
            color: #0284c7;
        }
        .light-theme .custom-tab-content {
            border: 1px solid #cbd5e1;
            background-color: #ffffff;
        }

        /* --- STRUCTURAL INTERFACE MECHANICS --- */
        .tab-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .tab-header-track {
            padding-bottom: 0;
            flex-grow: 1;
        }

        .custom-tab-header {
            display: inline-block;
            padding: 10px 20px;
            margin-right: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            border-radius: 6px 6px 0 0;
            transition: all 0.15s ease;
        }

        .custom-tab-content {
            display: none;
            width: 100%;
            height: 600px;
            border-radius: 0 0 6px 6px;
            overflow: auto; /* Changed to auto so the native widget content can scroll natively */
            padding: 20px;
            box-sizing: border-box;
        }

        .custom-tab-content.active-panel {
            display: block;
        }

        .tab-widget-frame {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Interactive Theme Action Trigger Element Button */
        .theme-toggle-btn {
            padding: 8px 14px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            border-radius: 20px;
            border: 1px solid #334155;
            background-color: #1e293b;
            color: #e2e8f0;
            transition: all 0.2s ease;
        }

        .light-theme .theme-toggle-btn {
            background-color: #ffffff;
            color: #1e293b;
            border: 1px solid #cbd5e1;
        }
    </style>
</head>
<body>

    <!-- Base anchor location layout slot -->
    <div id="app"></div>

    <script>
        // Array container mock initialization
        var values = [];

        // 1. Setup widget configurations. Notice tab1 uses type: 'widget' instead of a pure iframe URL string
        var tabConfig = [
            { id: 'tab1', label: 'iNaturalist', type: 'widget' },
            { id: 'tab2', label: 'System Logs', type: 'iframe', url: 'https://example.com' },
            { id: 'tab3', label: 'Configuration', type: 'iframe', url: 'https://example.com' }
        ];

        // 2. Scan localized browser storage key values to assert default session layout
        var savedTheme = localStorage.getItem('app-ui-theme') || 'dark-theme';
        
        // Match the background of the main document canvas frame straight out of the box
        if (savedTheme === 'light-theme') {
            document.body.style.backgroundColor = '#f8fafc';
        }

        var tabHeadersHtml = '';
        var tabContentsHtml = '';

        // 3. String concatenation iteration loop parsing structure inputs
        for (var i = 0; i < tabConfig.length; i++) {
            var tab = tabConfig[i];
            var isFirst = (i === 0);
            
            var headerClass = isFirst ? 'custom-tab-header active-tab' : 'custom-tab-header';
            var contentClass = isFirst ? 'custom-tab-content active-panel' : 'custom-tab-content';

            tabHeadersHtml += '<div id="header_' + tab.id + '" class="' + headerClass + '" onclick="switchTab(\'' + tab.id + '\')">' + tab.label + '</div>';
            
            if (tab.type === 'widget') {
                // If it is the iNaturalist widget, construct the exact inline div node placeholder you provided
                tabContentsHtml += '<div id="content_' + tab.id + '" class="' + contentClass + '">' +
                                   '<div id="inat-widget-container" ' +
                                   'data-inat-widget ' +
                                   'data-inat-source="cincinnati-nature-center-at-rowe-woods-oh-usa" ' +
                                   'data-inat-source-type="project" ' +
                                   'data-inat-theme="transparent-dark" ' +
                                   'data-inat-title="Cincinnati Nature Center at Rowe Woods, OH, USA" ' +
                                   'data-inat-layout="cards" ' +
                                   'data-inat-limit="12" ' +
                                   'data-inat-order-by="observed_on" ' +
                                   'data-inat-taxon="47224" ' +
                                   'data-inat-compact="true">' +
                                   '</div>' +
                                   '</div>';
            } else {
                // Keep standard iframe fallback configurations operational for regular pages
                var initialSrc = isFirst ? tab.url : '';
                tabContentsHtml += '<div id="content_' + tab.id + '" class="' + contentClass + '">' +
                                   '<iframe id="iframe_' + tab.id + '" class="tab-widget-frame" src="' + initialSrc + '"></iframe>' +
                                   '</div>';
            }
        }

        var btnLabel = (savedTheme === 'dark-theme') ? '☀️ Light Mode' : '🌙 Dark Mode';

        // 4. Form template view construction frame assignments
        var tabsWrapperHtml = '<div id="themeContainer" class="tab-component-container ' + savedTheme + '">' +
                              '<div class="tab-header-row">' +
                              '<div class="tab-header-track">' + tabHeadersHtml + '</div>' +
                              '<button class="theme-toggle-btn" onclick="toggleTheme()">' + btnLabel + '</button>' +
                              '</div>' +
                              '<div>' + tabContentsHtml + '</div>' +
                              '</div>';

        // Helper tracker tracking if the iNaturalist dependency payload script has executed on the DOM
        var inatScriptLoaded = false;

        // 5. Global Action Runtime Trigger Logic Operations mapping pointers
        window.switchTab = function(activeTabId) {
            var headers = document.querySelectorAll('.custom-tab-header');
            var contents = document.querySelectorAll('.custom-tab-content');
            
            for (var j = 0; j < headers.length; j++) {
                headers[j].classList.remove('active-tab');
            }
            for (var k = 0; k < contents.length; k++) {
                contents[k].classList.remove('active-panel');
            }
            
            var activeHeader = document.getElementById('header_' + activeTabId);
            var activeContent = document.getElementById('content_' + activeTabId);
            
            if (activeHeader && activeContent) {
                activeHeader.classList.add('active-tab');
                activeContent.classList.add('active-panel');
                
                // Find matching configuration data model
                var targetConfig = tabConfig.find(function(t) { return t.id === activeTabId; });
                
                if (targetConfig.type === 'iframe') {
                    var activeIframe = document.getElementById('iframe_' + activeTabId);
                    if (activeIframe && !activeIframe.getAttribute('src')) {
                        activeIframe.setAttribute('src', targetConfig.url);
                    }
                } else if (targetConfig.type === 'widget' && !inatScriptLoaded) {
                    // Lazy-loading injection workflow workflow specifically for handling the external widget JS asset safely
                    inatScriptLoaded = true;
                    var scriptNode = document.createElement('script');
                    scriptNode.src = 'https://glauberramos.github.io/inat/inat-widget.js';
                    document.body.appendChild(scriptNode);
                }
            }
        };

        window.toggleTheme = function() {
          var container = document.getElementById('themeContainer');
          var toggleBtn = document.querySelector('.theme-toggle-btn');
          var inatWidget = document.getElementById('inat-widget-container');
          if (container && toggleBtn) {
            if (container.classList.contains('dark-theme')) {
              container.classList.remove('dark-theme');
              container.classList.add('light-theme');
              document.body.style.backgroundColor = '#f8fafc';
              toggleBtn.innerHTML = '🌙 Dark Mode';
              localStorage.setItem('app-ui-theme', 'light-theme');
              // Dynamically swap the iNaturalist widget layout parameters theme attribute safely if it exists
              if (inatWidget) {
                inatWidget.setAttribute('data-inat-theme', 'light');
              }
            } else {
              container.classList.remove('light-theme');
              container.classList.add('dark-theme');
              document.body.style.backgroundColor = '#0f172a';
              toggleBtn.innerHTML = '☀️ Light Mode';
              localStorage.setItem('app-ui-theme', 'dark-theme');
              if (inatWidget) {
                inatWidget.setAttribute('data-inat-theme', 'transparent-dark');
              }
            }
          }
        };// Render the setup string down to the live window document view location
values.push({ innerHTML: tabsWrapperHtml });

document.getElementById('app').innerHTML = values[0].innerHTML; 

window.switchTab('tab1'); 
      // Run switch tab immediately initialization trigger on execution completion for the first item (iNaturalist)
      window.switchTab(tabConfig[0].id);

</script>
</body>
</html>
